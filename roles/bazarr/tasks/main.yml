---
- name: "Install bazarr dependencies"
  become: true
  ansible.builtin.apt:
    name:
      - "python3-venv"
      - "python3-packaging"   # for ansible.builtin.pip below
      - "ffmpeg"   # ffprobe, to read audio and subtitle tracks
      - "unzip"
    state: "present"
    install_recommends: false

- name: "Create bazarr group"
  become: true
  ansible.builtin.group:
    name: "{{ bazarr_group }}"
    gid: "{{ bazarr_group_id | default(omit) }}"
    system: true

- name: "Create bazarr user"
  become: true
  ansible.builtin.user:
    name: "bazarr"
    group: "{{ bazarr_group }}"
    system: true
    shell: "/usr/sbin/nologin"
    home: "/var/lib/bazarr"
    create_home: true

- name: "Ensure bazarr directories exist"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "bazarr"
    group: "{{ bazarr_group }}"
    mode: "0750"
  loop:
    - "/opt/bazarr"
    - "/var/lib/bazarr/config"

# Installed once from the latest release; after that bazarr updates itself, so the install dir is its own
- name: "Install bazarr"
  become: true
  ansible.builtin.unarchive:
    src: "https://github.com/morpheus65535/bazarr/releases/latest/download/bazarr.zip"
    dest: "/opt/bazarr"
    remote_src: true
    creates: "/opt/bazarr/bazarr.py"
    owner: "bazarr"
    group: "{{ bazarr_group }}"

# Also picks up requirements added by a self-update. Runs as root (containers have no sudo to switch users),
# so the venv is handed to bazarr right after, which its self-update needs
- name: "Install bazarr python requirements"
  become: true
  ansible.builtin.pip:
    requirements: "/opt/bazarr/requirements.txt"
    virtualenv: "/opt/bazarr/venv"
    virtualenv_command: "python3 -m venv"
  notify: "Restart bazarr"

- name: "Hand the bazarr venv to bazarr"
  become: true
  ansible.builtin.file:
    path: "/opt/bazarr/venv"
    state: "directory"
    owner: "bazarr"
    group: "{{ bazarr_group }}"
    recurse: true

- name: "Install bazarr service"
  become: true
  ansible.builtin.template:
    src: "bazarr.service.j2"
    dest: "/etc/systemd/system/bazarr.service"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart bazarr"

- name: "Ensure bazarr is enabled and running"
  become: true
  ansible.builtin.systemd_service:
    name: "bazarr"
    enabled: true
    state: "started"
    daemon_reload: true

# Bazarr fills config.yaml with its defaults on first start; the role then sets its own keys in it
- name: "Wait for bazarr config"
  become: true
  ansible.builtin.wait_for:
    path: "/var/lib/bazarr/config/config.yaml"
    search_regex: "apikey"
    timeout: 120

- name: "Read bazarr config"
  become: true
  ansible.builtin.slurp:
    path: "/var/lib/bazarr/config/config.yaml"
  register: bazarr_config_file
  no_log: true

# Bazarr keeps its settings in memory and writes them back to config.yaml itself, so the file is only changed while
# Bazarr is stopped, and only when a managed key differs (its own formatting and web UI settings are kept)
- name: "Set bazarr settings"
  vars:
    bazarr_config_current: "{{ bazarr_config_file.content | b64decode | from_yaml }}"
    bazarr_config: "{{ bazarr_config_current | combine(bazarr_settings, recursive=True) }}"
  when: bazarr_config != bazarr_config_current
  block:
    - name: "Stop bazarr before changing its settings"
      become: true
      ansible.builtin.systemd_service:
        name: "bazarr"
        state: "stopped"

    - name: "Write bazarr settings"
      become: true
      ansible.builtin.copy:
        dest: "/var/lib/bazarr/config/config.yaml"
        content: "{{ bazarr_config | to_nice_yaml(indent=2) }}"
        owner: "bazarr"
        group: "{{ bazarr_group }}"
        mode: "0600"
      no_log: true

    - name: "Start bazarr with its new settings"
      become: true
      ansible.builtin.systemd_service:
        name: "bazarr"
        state: "started"

# Pending restarts (new requirements or service file) first, so the API below is the current Bazarr
- name: "Apply pending bazarr restarts"
  ansible.builtin.meta: flush_handlers

- name: "Wait for bazarr API"
  ansible.builtin.uri:
    url: "http://{{ network_ipv4_address }}:{{ bazarr_port }}/api/system/status"
    headers:
      X-API-KEY: "{{ bazarr_api_key }}"
  register: bazarr_status
  until: bazarr_status.status == 200
  retries: 30
  delay: 2
  no_log: true

- name: "Read bazarr languages"
  ansible.builtin.uri:
    url: "http://{{ network_ipv4_address }}:{{ bazarr_port }}/api/system/languages"
    headers:
      X-API-KEY: "{{ bazarr_api_key }}"
  register: bazarr_current_languages
  no_log: true

- name: "Read bazarr languages profiles"
  ansible.builtin.uri:
    url: "http://{{ network_ipv4_address }}:{{ bazarr_port }}/api/system/languages/profiles"
    headers:
      X-API-KEY: "{{ bazarr_api_key }}"
  register: bazarr_current_profiles
  no_log: true

# Bazarr's settings API is itself a source of truth: unlisted languages are disabled, unlisted profiles deleted
- name: "Set bazarr languages and profile"
  ansible.builtin.uri:
    url: "http://{{ network_ipv4_address }}:{{ bazarr_port }}/api/system/settings"
    method: "POST"
    headers:
      X-API-KEY: "{{ bazarr_api_key }}"
    body_format: "form-urlencoded"
    body:
      languages-enabled: "{{ bazarr_languages }}"
      languages-profiles: "{{ [bazarr_languages_profile] | to_json }}"
    status_code: [204]
  when: >-
    (bazarr_current_languages.json | selectattr('enabled') | map(attribute='code2') | sort) != (bazarr_languages | sort)
    or bazarr_current_profiles.json | length != 1
    or bazarr_current_profiles.json[0].name != bazarr_languages_profile.name
    or (bazarr_current_profiles.json[0]['items'] | map(attribute='language') | list) != bazarr_languages
  changed_when: true
  no_log: true

- name: "Create bazarr proxy vhost"
  when: bazarr_hostname is defined
  tags:
    - "vhost"
  ansible.builtin.include_role:
    name: "vhost"
  vars:
    vhost_name: "bazarr"
    vhost_nginx_content: "{{ lookup('template', 'bazarr.nginx.conf.j2') }}"
    vhost_caddy_content: "{{ lookup('template', 'bazarr.caddy.j2') }}"
