---
- name: "Create restic restore cache directory"
  become: true
  ansible.builtin.file:
    path: "/var/cache/{{ backup_name }}-restore"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0700"

- name: "Deploy restore script"
  become: true
  ansible.builtin.template:
    src: "restore.sh.j2"
    dest: "/usr/local/bin/restore-{{ backup_name }}"
    owner: "root"
    group: "root"
    mode: "0755"

- name: "Run restore"
  become: true
  ansible.builtin.command:
    cmd: "/usr/local/bin/restore-{{ backup_name }}"
  changed_when: true
