---
- name: "Create backup group"
  become: true
  ansible.builtin.group:
    name: "{{ backup_group }}"
    system: true

- name: "Create backup user"
  become: true
  ansible.builtin.user:
    name: "{{ backup_user }}"
    group: "{{ backup_group }}"
    system: true
    shell: "/sbin/nologin"
    create_home: false

# Walks each backup path's ancestors, granting execute-only traversal so the
# backup user can reach it even through a private (mode 0700) home directory.
- name: "Grant backup traverse access to backup path ancestor directories"
  become: true
  ansible.builtin.shell: |
    set -e
    path={{ item | quote }}
    while true; do
      path=$(dirname "$path")
      [ "$path" = "/" ] && break
      setfacl -m "g:{{ backup_group }}:x" "$path"
    done
  changed_when: false
  loop: "{{ backup_paths }}"

# -m grants access on files/dirs that already exist; -d -m is a default ACL so
# anything created later (e.g. an app rewriting a file via temp-then-rename)
# inherits read access too. Both need -R to reach every subdirectory.
# ansible.posix.acl's recursive + default combo silently no-ops instead of
# doing this (tested on 2.1.0), so setfacl is called directly here.
# NOTE: backup_group gets execute (traverse) on every ancestor of backup_paths
# (e.g. the whole home dir chain). Any sibling directory under that chain that
# is already world-readable becomes reachable too — accepted tradeoff.
- name: "Grant backup read access to backup paths"
  become: true
  ansible.builtin.command:
    cmd: >-
      setfacl -R
      -m "g:{{ backup_group }}:rx"
      -d -m "g:{{ backup_group }}:rx"
      {{ item | quote }}
  changed_when: false
  loop: "{{ backup_paths }}"

- name: "Create restic cache directory"
  become: true
  ansible.builtin.file:
    path: "/var/cache/{{ backup_name }}-backup"
    state: "directory"
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: "0700"

- name: "Create credential store directory"
  become: true
  ansible.builtin.file:
    path: "/etc/credstore"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0700"

- name: "Deploy backup credentials"
  become: true
  ansible.builtin.template:
    src: "backup.env.j2"
    dest: "/etc/credstore/{{ backup_name }}-backup.env"
    owner: "root"
    group: "root"
    mode: "0600"
  no_log: true

- name: "Include service-manager-specific configuration tasks"
  ansible.builtin.include_tasks: "configure-{{ ansible_facts.service_mgr }}.yml"

- name: "Create restic restore cache directory"
  become: true
  ansible.builtin.file:
    path: "/var/cache/{{ backup_name }}-restore"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0700"
  tags:
    - "never"
    - "restore"

- name: "Deploy restore script"
  become: true
  ansible.builtin.template:
    src: "restore.sh.j2"
    dest: "/usr/local/bin/{{ backup_name }}-restore"
    owner: "root"
    group: "root"
    mode: "0755"
  tags:
    - "never"
    - "restore"

- name: "Run restore"
  become: true
  ansible.builtin.command:
    cmd: "/usr/local/bin/{{ backup_name }}-restore"
  changed_when: true
  tags:
    - "never"
    - "restore"
