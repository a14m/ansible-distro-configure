---
- name: "Create blackbox_exporter group"
  become: true
  ansible.builtin.group:
    name: "blackbox_exporter"
    system: true

- name: "Create blackbox_exporter user"
  become: true
  ansible.builtin.user:
    name: "blackbox_exporter"
    group: "blackbox_exporter"
    system: true
    shell: "/usr/sbin/nologin"
    create_home: false

- name: "Create blackbox_exporter directories"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
  loop:
    - "{{ blackbox_exporter_install_dir }}"
    - "/etc/blackbox_exporter"

- name: "Check installed blackbox_exporter version"
  ansible.builtin.command:
    cmd: "{{ blackbox_exporter_install_dir }}/blackbox_exporter --version"
  register: blackbox_exporter_installed
  changed_when: false
  failed_when: false

- name: "Install blackbox_exporter"
  become: true
  when: >-
    blackbox_exporter_version not in
    (blackbox_exporter_installed.stderr | default('') ~ blackbox_exporter_installed.stdout | default(''))
  vars:
    blackbox_exporter_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armv7'}[ansible_facts.architecture] }}
  ansible.builtin.unarchive:
    src: >-
      https://github.com/prometheus/blackbox_exporter/releases/download/v{{
      blackbox_exporter_version }}/blackbox_exporter-{{
      blackbox_exporter_version }}.linux-{{ blackbox_exporter_arch }}.tar.gz
    dest: "{{ blackbox_exporter_install_dir }}"
    remote_src: true
    extra_opts: ["--strip-components=1"]
    owner: "root"
    group: "root"
  notify: "Restart blackbox_exporter"

- name: "Deploy blackbox_exporter config"
  become: true
  ansible.builtin.template:
    src: "config.yml.j2"
    dest: "/etc/blackbox_exporter/config.yml"
    owner: "root"
    group: "blackbox_exporter"
    mode: "0640"
    validate: "{{ blackbox_exporter_install_dir }}/blackbox_exporter --config.check --config.file=%s"
  notify: "Restart blackbox_exporter"

- name: "Deploy blackbox_exporter service"
  become: true
  ansible.builtin.template:
    src: "blackbox_exporter.service.j2"
    dest: "/etc/systemd/system/blackbox_exporter.service"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart blackbox_exporter"

- name: "Start and enable blackbox_exporter"
  become: true
  ansible.builtin.systemd_service:
    name: "blackbox_exporter"
    state: "started"
    enabled: true
    daemon_reload: true
