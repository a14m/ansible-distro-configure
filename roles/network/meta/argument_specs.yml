---
argument_specs:
  main:
    options:
      network_wifi_ssid:
        type: "str"
        description: "The WIFI SSID to be configure when provided"
        required: false
        default: ""
      network_wifi_pass:
        type: "str"
        description: "The WIFI Passphrase to be configure when provided"
        required: false
        default: ""
      network_ipv4_address:
        type: "str"
        description: "The network IP(4) address to configure when provided"
      network_ipv4_gateway:
        type: "str"
        description: "The network IP(4) gateway to configure when provided"
      network_ipv4_dns:
        type: "str"
        description: "The network IP(4) gateway to configure when provided"
      network_bridge_interface:
        type: "str"
        description: "Physical NIC to enslave as vmbr0 bridge port"
        required: false
      network_ipv6_method:
        type: "str"
        description: >-
          NetworkManager [ipv6] method - "disabled" by default, since a device that gets a real
          IPv6 via SLAAC ("auto") routes it directly, bypassing the gateway role's IPv4-only
          VPN-mode tunnel and leaking traffic outside it. Only set to "auto" on hosts that aren't
          meant to be privacy-routed through that gateway.
        choices: ["disabled", "auto"]
        required: false
        default: "disabled"
