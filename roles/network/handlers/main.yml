---
- name: "Reload systemd"
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_facts.is_chroot

- name: "Restart NetworkManager"
  become: true
  ansible.builtin.systemd_service:
    name: "NetworkManager"
    enabled: true
    state: "restarted"
  when: not ansible_facts.is_chroot
