---
# Runs delegated to vhost_proxy_host; acme.sh itself comes from the acme-sh
# role in the proxy's own play (checked at runtime)
dependencies: []
galaxy_info:
  author: "a14m"
  description: "Obtain a Let's Encrypt certificate for a domain via Cloudflare DNS-01 on the proxy"
  license: "MIT"
  min_ansible_version: "2.18"
  platforms:
    - name: "Alpine"
      versions:
        - "all"
    - name: "ArchLinux"
      versions:
        - "all"
    - name: "Ubuntu"
      versions:
        - "noble"
    - name: "Debian"
      versions:
        - "bookworm"
        - "trixie"
