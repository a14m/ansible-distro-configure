---
argument_specs:
  main:
    options:
      prometheus_host:
        description: "host for Prometheus web interface"
        type: "str"
        default: "127.0.0.1"
      prometheus_port:
        description: "Port for Prometheus web interface"
        type: "int"
        default: 9090
      prometheus_retention:
        description: "Data retention period for Prometheus"
        type: "str"
        default: "15d"
      prometheus_scrape_interval:
        description: "Global scrape interval for metrics collection"
        type: "str"
        default: "15s"
      prometheus_targets:
        description: "The list of prometheus targets to scrape"
        type: "list"
        elements: "str"
        default: ["{{ prometheus_host }}:{{ prometheus_port }}"]
      prometheus_node_exporter_targets:
        description: "The list of node_exporter targets to scrape"
        type: "list"
        elements: "str"
        default: []
      prometheus_hostname:
        type: "str"
        description: >-
          FQDN for the prometheus vhost (e.g. 'metrics.home.arpa').
          Leave undefined to skip vhost creation entirely.
      prometheus_extra_scrape_configs:
        description: "Additional Prometheus scrape jobs"
        type: "list"
        elements: "dict"
        default: []
        options:
          name:
            description: "Job name"
            type: "str"
            required: true
          targets:
            description: "List of host:port targets to scrape"
            type: "list"
            elements: "str"
            required: true
          metrics_path:
            description: "Path to scrape metrics from"
            type: "str"
            default: "/metrics"
          scrape_interval:
            description: "Scrape interval for this job"
            type: "str"
            default: "{{ prometheus_scrape_interval }}"
          bearer_token:
            description: "Bearer token sent as an Authorization header, if the target requires one"
            type: "str"
          params:
            description: >-
              Query-string parameters for the scrape, e.g. {module: [icmp]} for
              the blackbox exporter's /probe endpoint.
            type: "dict"
          relabel_configs:
            description: >-
              Prometheus relabel_configs for this job (list of dicts), e.g. the
              blackbox multi-target pattern that maps a target into __param_target.
            type: "list"
            elements: "dict"
