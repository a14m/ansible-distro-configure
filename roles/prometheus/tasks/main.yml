---
- name: "Include OS-specific variables"
  ansible.builtin.include_vars: "{{ ansible_facts.os_family | lower }}.yml"

- name: "Create prometheus group"
  become: true
  ansible.builtin.group:
    name: "prometheus"
    system: true

- name: "Create prometheus user"
  become: true
  ansible.builtin.user:
    name: "prometheus"
    group: "prometheus"
    system: true
    shell: "/usr/sbin/nologin"
    create_home: false

- name: "Create prometheus directories"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "prometheus"
    group: "prometheus"
    mode: "0755"
  loop:
    - "/etc/prometheus"
    - "/var/lib/prometheus"

- name: "Include OS-specific installation tasks"
  ansible.builtin.include_tasks: "install-{{ ansible_facts.os_family | lower }}.yml"

- name: "Create prometheus configuration"
  become: true
  ansible.builtin.template:
    src: "prometheus.yml.j2"
    dest: "/etc/prometheus/prometheus.yml"
    owner: "prometheus"
    group: "prometheus"
    mode: "0644"
  notify: "Restart prometheus"

- name: "Include service-manager-specific configuration tasks"
  ansible.builtin.include_tasks: "configure-{{ ansible_facts.service_mgr }}.yml"

- name: "Start and enable prometheus"
  become: true
  ansible.builtin.service:
    name: "prometheus"
    state: "started"
    enabled: true

- name: "Create prometheus proxy vhost"
  when: prometheus_hostname is defined
  ansible.builtin.include_role:
    name: "vhost"
  vars:
    vhost_name: "prometheus"
    vhost_nginx_content: "{{ lookup('template', 'prometheus.nginx.conf.j2') }}"
    vhost_caddy_content: "{{ lookup('template', 'prometheus.caddy.j2') }}"
    vhost_proxy_host: "proxy.home.arpa"
