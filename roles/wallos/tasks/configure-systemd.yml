---
- name: "Deploy wallos systemd service"
  become: true
  ansible.builtin.template:
    src: "wallos.service.j2"
    dest: "/etc/systemd/system/wallos.service"
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - "Reload systemd"
    - "Restart wallos"

- name: "Start and enable wallos"
  become: true
  ansible.builtin.systemd_service:
    name: "wallos"
    state: "started"
    enabled: true
    daemon_reload: true

- name: "Deploy wallos cron job systemd services"
  become: true
  ansible.builtin.template:
    src: "wallos-cronjob.service.j2"
    dest: "/etc/systemd/system/wallos-{{ item.name }}.service"
    owner: "root"
    group: "root"
    mode: "0644"
  loop: "{{ wallos_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  notify: "Reload systemd"

- name: "Deploy wallos cron job systemd timers"
  become: true
  ansible.builtin.template:
    src: "wallos-cronjob.timer.j2"
    dest: "/etc/systemd/system/wallos-{{ item.name }}.timer"
    owner: "root"
    group: "root"
    mode: "0644"
  loop: "{{ wallos_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  notify: "Reload systemd"

- name: "Enable and start wallos cron job timers"
  become: true
  ansible.builtin.systemd_service:
    name: "wallos-{{ item.name }}.timer"
    enabled: true
    state: "started"
    daemon_reload: true
  loop: "{{ wallos_jobs }}"
  loop_control:
    label: "{{ item.name }}"
