---
- name: "Include OS-specific variables"
  ansible.builtin.include_vars: "{{ ansible_facts.os_family | lower }}.yml"

- name: "Ensure ufw is installed"
  become: true
  ansible.builtin.package:
    name: "{{ ufw_packages }}"
    state: "present"

- name: "Disable ufw"
  become: true
  when: not ufw_enabled
  community.general.ufw:
    state: "disabled"

- name: "Configure and enable ufw"
  when: ufw_enabled
  block:
    - name: "Set default policies"
      # noqa: args[module] values are validated by meta/argument_specs.yml
      become: true
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: "incoming", policy: "{{ ufw_default_incoming_policy }}" }
        - { direction: "outgoing", policy: "{{ ufw_default_outgoing_policy }}" }
      # The module's "default" command has no real pre-check outside check-mode; it
      # diffs full `ufw status verbose` text before/after, which can shift (rule
      # renumbering) even when the policy itself is unchanged.
      changed_when: false

    - name: "Apply rules"
      become: true
      community.general.ufw:
        rule: "{{ item.rule }}"
        direction: "{{ item.direction | default(omit) }}"
        route: "{{ item.route | default(omit) }}"
        protocol: "{{ item.protocol }}"
        port: "{{ item.port | default(omit) }}"
        from: "{{ item.from | default(omit) }}"
        to: "{{ item.to | default(omit) }}"
        interface: "{{ item.interface | default(omit) }}"
      loop: "{{ ufw_rules }}"

    - name: "Enable ufw"
      become: true
      community.general.ufw:
        state: "enabled"

- name: "Allow the openrc service to start with ufw disabled"
  become: true
  ansible.builtin.copy:
    dest: "/etc/conf.d/ufw"
    owner: "root"
    group: "root"
    mode: "0644"
    content: |
      ufw_nonfatal_if_disabled="yes"
  when: ansible_facts.os_family == "Alpine"

- name: "Enable ufw service at boot"
  become: true
  ansible.builtin.service:
    name: "ufw"
    enabled: true
