---
argument_specs:
  main:
    options:
      ufw_enabled:
        description: "Whether ufw should be configured and enabled. When false, ufw is disabled instead."
        type: "bool"
        default: true
      ufw_default_incoming_policy:
        description: "Policy for incoming traffic not matched by ufw_rules."
        type: "str"
        default: "deny"
        choices:
          - "allow"
          - "deny"
          - "reject"
      ufw_default_outgoing_policy:
        description: "Policy for outgoing traffic not matched by ufw_rules (e.g. 'deny' for a VPN kill switch)."
        type: "str"
        default: "allow"
        choices:
          - "allow"
          - "deny"
          - "reject"
      ufw_rules:
        type: "list"
        elements: "dict"
        required: false
        default: []
        description: "Allow rules to apply on top of the deny-all default."
        options:
          rule:
            type: "str"
            required: true
            choices:
              - "allow"
              - "deny"
              - "limit"
              - "reject"
            description: "Same choices as community.general.ufw's own 'rule' argument."
          port:
            type: "int"
            required: false
            description: "Destination port. Omit to match any port."
          protocol:
            type: "str"
            required: true
            choices:
              - "any"
              - "tcp"
              - "udp"
              - "ipv6"
              - "esp"
              - "ah"
              - "gre"
              - "igmp"
              - "vrrp"
            description: "Same choices as community.general.ufw's own 'proto' argument."
          direction:
            type: "str"
            required: false
            choices:
              - "in"
              - "out"
            description: >-
              Traffic direction for a directional rule. Mutually exclusive with 'route' -
              community.general.ufw only accepts "in"/"out" here (unlike its 'direction'
              argument, "routed" is not valid on a per-rule basis).
          route:
            type: "bool"
            required: false
            default: false
            description: >-
              Apply the rule to routed/forwarded packets (ufw's FORWARD chain, e.g. a
              Tailscale subnet router) instead of a directional one. Mutually exclusive
              with 'direction'.
          from:
            type: "str"
            required: false
            description: "Source IP/CIDR, or 'any'. Required unless 'interface' or 'to' is set."
          to:
            type: "str"
            required: false
            description: "Destination IP/CIDR, or 'any'."
          interface:
            type: "str"
            required: false
            description: >-
              Restrict the rule to this interface, inbound or outbound following 'direction',
              instead of a source IP (e.g. DHCP broadcast in, a VPN tunnel out). Mutually exclusive with 'from'.
