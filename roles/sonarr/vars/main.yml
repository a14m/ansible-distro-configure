---
# qBittorrent download client in API form (see the servarr README)
sonarr_download_client:
  name: "qBittorrent"
  implementation: "QBittorrent"
  protocol: "torrent"
  enable: true
  priority: 1
  removeCompletedDownloads: true   # after the seed limit
  removeFailedDownloads: true
  tags: []
  fields:
    host: "{{ sonarr_qbittorrent.host }}"
    port: "{{ sonarr_qbittorrent.port }}"
    username: "{{ sonarr_qbittorrent.username }}"
    password: "{{ sonarr_qbittorrent.password }}"
    tvCategory: "tv"   # downloads go to <save path>/tv
