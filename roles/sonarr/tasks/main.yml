---
- name: "Install sonarr"
  ansible.builtin.include_role:
    name: "servarr"
    tasks_from: "app"
  vars:
    servarr_app: "sonarr"
    servarr_download_url: "https://services.sonarr.tv/v1/download/main/latest?version=4&os=linux&arch=x64"
    servarr_port: "{{ sonarr_port }}"
    servarr_api_key: "{{ sonarr_api_key }}"
    servarr_group: "{{ sonarr_group }}"
    servarr_group_id: "{{ sonarr_group_id | default(none) }}"
    servarr_allowed_hosts: "{{ sonarr_allowed_hosts }}"
    servarr_root_folders: "{{ sonarr_root_folders }}"
    servarr_hostname: "{{ sonarr_hostname | default(none) }}"

# Listed ones added or updated, others removed (root folders only from Sonarr, never their files)
- name: "Manage sonarr root folders"
  servarr_resources:
    url: "http://{{ network_ipv4_address }}:{{ sonarr_port }}/api/v3/rootfolder"
    api_key: "{{ sonarr_api_key }}"
    key: "path"
    resources: "{{ sonarr_root_folders | map('community.general.dict_kv', 'path') }}"

- name: "Manage sonarr download clients"
  servarr_resources:
    url: "http://{{ network_ipv4_address }}:{{ sonarr_port }}/api/v3/downloadclient"
    api_key: "{{ sonarr_api_key }}"
    resources: "{{ [sonarr_download_client] }}"
  no_log: true   # password
