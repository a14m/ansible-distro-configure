---
argument_specs:
  main:
    options:
      mount_device:
        type: "str"
        description: "Device to mount (e.g. PARTLABEL=backup)"
        required: true
      mount_point:
        type: "str"
        description: "Mount point for the drive"
        default: "/mnt/backup"
      mount_fstype:
        type: "str"
        description: "Filesystem type of the device"
        default: "ext4"
      mount_options:
        type: "str"
        description: "Mount options for the device"
        default: "defaults,noatime"
      mount_owner:
        type: "str"
        description: "Owner of the mounted directory (name or UID)"
        default: "root"
      mount_group:
        type: "str"
        description: "Group of the mounted directory (name or GID)"
        default: "root"
      mount_mode:
        type: "str"
        description: "Mode of the mounted directory"
        default: "0755"
