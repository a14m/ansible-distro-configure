---
# Creates the mount point if missing; ownership is set after mounting so it applies to the mounted filesystem
- name: "Mount drive"
  become: true
  ansible.posix.mount:
    path: "{{ mount_point }}"
    src: "{{ mount_device }}"
    fstype: "{{ mount_fstype }}"
    opts: "{{ mount_options }}"
    state: "mounted"

- name: "Set mount point ownership"
  become: true
  ansible.builtin.file:
    path: "{{ mount_point }}"
    state: "directory"
    owner: "{{ mount_owner }}"
    group: "{{ mount_group }}"
    mode: "{{ mount_mode }}"
