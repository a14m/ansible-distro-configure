---
# Interfaces are named after the keys, and the gateway role only handles wg* interfaces
- name: "Validate WireGuard connection names start with wg"
  ansible.builtin.assert:
    that:
      - wireguard_connections.keys() | reject("match", "^wg") | list | length == 0
    fail_msg: >-
      WireGuard connection names must start with 'wg':
      {{ wireguard_connections.keys() | reject('match', '^wg') | list }}
    quiet: true

- name: "Include OS-specific installation tasks"
  ansible.builtin.include_tasks: "install-{{ ansible_facts.os_family | lower }}.yml"

- name: "Ensure systemd-resolved is enabled and running"
  become: true
  ansible.builtin.systemd_service:
    name: "systemd-resolved"
    enabled: true
    state: "started"

- name: "Find existing WireGuard connections"
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    ls /etc/wireguard/*.conf | xargs -n1 basename | sed 's/\.conf$//'
  args:
    executable: /bin/bash
  register: wireguard_existing_connections
  changed_when: false
  failed_when: false

- name: "Remove extra WireGuard connections"
  become: true
  ansible.builtin.file:
    path: "/etc/wireguard/{{ item }}.conf"
    state: "absent"
  loop: "{{ wireguard_existing_connections.stdout_lines }}"
  when:
    - wireguard_existing_connections.stdout_lines is defined
    - wireguard_existing_connections.stdout_lines | length > 0
    - item not in wireguard_connections.keys()

- name: "Deploy WireGuard connections"
  become: true
  ansible.builtin.copy:
    content: "{{ wireguard_connections[item] }}"
    dest: "/etc/wireguard/{{ item }}.conf"
    owner: "root"
    group: "root"
    mode: "0600"
  loop: "{{ wireguard_connections.keys() }}"
  when: wireguard_connections | length > 0
  tags:
    # The reason the test is ignored is the following:
    # 1st run: wireguard role deploys all the configured VPN connections
    # 1st run: wg_portal updates the (ACL) file permissions /etc/wireguard
    # 2nd run: wireguard sees the file changed, deploys again (changed)
    - molecule-idempotence-notest

- name: "Enable and start the autostart connection"
  become: true
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wireguard_autostart_connection }}"
    enabled: true
    state: "started"
  when: wireguard_autostart_connection is defined
