---
# qBittorrent download client in API form (see the servarr README)
radarr_download_client:
  name: "qBittorrent"
  implementation: "QBittorrent"
  protocol: "torrent"
  enable: true
  priority: 1
  removeCompletedDownloads: true   # after the seed limit
  removeFailedDownloads: true
  tags: []
  fields:
    host: "{{ radarr_qbittorrent.host }}"
    port: "{{ radarr_qbittorrent.port }}"
    username: "{{ radarr_qbittorrent.username }}"
    password: "{{ radarr_qbittorrent.password }}"
    movieCategory: "movies"   # downloads go to <save path>/movies

# This app as an application in Prowlarr, which then syncs its indexers here
radarr_prowlarr_application:
  name: "Radarr"
  implementation: "Radarr"
  syncLevel: "fullSync"   # adds, updates and removes indexers to match Prowlarr
  tags: []
  fields:
    prowlarrUrl: "{{ radarr_prowlarr.url }}"
    baseUrl: "http://{{ network_ipv4_address }}:{{ radarr_port }}"
    apiKey: "{{ radarr_api_key }}"
    syncCategories: "{{ radarr_prowlarr.sync_categories }}"
