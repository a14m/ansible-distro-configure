---
# qBittorrent download client in API form (see the servarr README)
radarr_download_client:
  name: "qBittorrent"
  implementation: "QBittorrent"
  protocol: "torrent"
  enable: true
  priority: 1
  removeCompletedDownloads: true   # after the seed limit
  removeFailedDownloads: true
  tags: []
  fields:
    host: "{{ radarr_qbittorrent.host }}"
    port: "{{ radarr_qbittorrent.port }}"
    username: "{{ radarr_qbittorrent.username }}"
    password: "{{ radarr_qbittorrent.password }}"
    movieCategory: "movies"   # downloads go to <save path>/movies
