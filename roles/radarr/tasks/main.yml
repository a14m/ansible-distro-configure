---
- name: "Install radarr dependencies"
  become: true
  ansible.builtin.apt:
    name:
      - "libicu76"
      - "libsqlite3-0"
      - "python3-lxml"   # for community.general.xml below
    state: "present"
    install_recommends: false

- name: "Create radarr group"
  become: true
  ansible.builtin.group:
    name: "{{ radarr_group }}"
    gid: "{{ radarr_group_id | default(omit) }}"
    system: true

- name: "Create radarr user"
  become: true
  ansible.builtin.user:
    name: "radarr"
    group: "{{ radarr_group }}"
    system: true
    shell: "/usr/sbin/nologin"
    home: "/var/lib/radarr"
    create_home: true

- name: "Create radarr root folders"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "radarr"
    group: "{{ radarr_group }}"
    mode: "2775"   # setgid: new files keep the group
  loop: "{{ radarr_root_folders }}"

# Installed once from the latest release; after that radarr updates itself, so the install dir is its own
- name: "Install radarr"
  become: true
  ansible.builtin.unarchive:
    src: "https://radarr.servarr.com/v1/update/master/updatefile?os=linux&runtime=netcore&arch=x64"
    dest: "/opt"
    remote_src: true
    creates: "/opt/Radarr/Radarr"
    owner: "radarr"
    group: "{{ radarr_group }}"

- name: "Create radarr config file"
  become: true
  ansible.builtin.copy:
    dest: "/var/lib/radarr/config.xml"
    content: "<Config></Config>\n"
    force: false
    owner: "radarr"
    group: "{{ radarr_group }}"
    mode: "0600"

# Radarr keeps unknown keys and adds its own, so only these are managed; everything else stays in the web UI
- name: "Set radarr settings"
  become: true
  community.general.xml:
    path: "/var/lib/radarr/config.xml"
    xpath: "/Config/{{ item.key }}"
    value: "{{ item.value | string }}"   # the xml module only takes text; the port would arrive as an int
  loop:
    - { key: "BindAddress", value: "{{ network_ipv4_address }}" }
    - { key: "Port", value: "{{ radarr_port }}" }
    - { key: "ApiKey", value: "{{ radarr_api_key }}" }
    # AuthenticationMethod stays unset so the first visit asks for the login method and user
    - { key: "AuthenticationRequired", value: "Enabled" }    # also for LAN addresses, which include the proxy
    - { key: "AllowedHosts", value: "{{ radarr_allowed_hosts | join(',') }}" }
    - { key: "AnalyticsEnabled", value: "False" }
    - { key: "LaunchBrowser", value: "False" }
  loop_control:
    label: "{{ item.key }}"
  no_log: "{{ item.key == 'ApiKey' }}"
  notify: "Restart radarr"

- name: "Install radarr service"
  become: true
  ansible.builtin.template:
    src: "radarr.service.j2"
    dest: "/etc/systemd/system/radarr.service"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart radarr"

- name: "Ensure radarr is enabled and running"
  become: true
  ansible.builtin.systemd_service:
    name: "radarr"
    enabled: true
    state: "started"
    daemon_reload: true

- name: "Wait for radarr API"
  ansible.builtin.uri:
    url: "http://{{ network_ipv4_address }}:{{ radarr_port }}/ping"
  register: radarr_ping
  until: radarr_ping.status == 200
  retries: 30
  delay: 2

# Added once if missing (by path); later edits in the web UI are kept
- name: "Read radarr root folders"
  ansible.builtin.uri:
    url: "http://{{ network_ipv4_address }}:{{ radarr_port }}/api/v3/rootfolder"
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
  register: radarr_existing_root_folders
  no_log: true

- name: "Add radarr root folders"
  ansible.builtin.uri:
    url: "http://{{ network_ipv4_address }}:{{ radarr_port }}/api/v3/rootfolder"
    method: "POST"
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    body_format: "json"
    body:
      path: "{{ item }}"
    status_code: [201]
  loop: "{{ radarr_root_folders }}"
  when: item not in radarr_existing_root_folders.json | map(attribute='path')
  changed_when: true

- name: "Create radarr proxy vhost"
  when: radarr_hostname is defined
  tags:
    - "vhost"
  ansible.builtin.include_role:
    name: "vhost"
  vars:
    vhost_name: "radarr"
    vhost_nginx_content: "{{ lookup('template', 'radarr.nginx.conf.j2') }}"
    vhost_caddy_content: "{{ lookup('template', 'radarr.caddy.j2') }}"
