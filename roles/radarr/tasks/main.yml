---
- name: "Install radarr"
  ansible.builtin.include_role:
    name: "servarr"
    tasks_from: "app"
  vars:
    servarr_app: "radarr"
    servarr_download_url: "https://radarr.servarr.com/v1/update/master/updatefile?os=linux&runtime=netcore&arch=x64"
    servarr_port: "{{ radarr_port }}"
    servarr_api_key: "{{ radarr_api_key }}"
    servarr_group: "{{ radarr_group }}"
    servarr_group_id: "{{ radarr_group_id | default(none) }}"
    servarr_allowed_hosts: "{{ radarr_allowed_hosts }}"
    servarr_root_folders: "{{ radarr_root_folders }}"
    servarr_hostname: "{{ radarr_hostname | default(none) }}"

# Listed ones added or updated, others removed (root folders only from Radarr, never their files)
- name: "Manage radarr root folders"
  servarr_resources:
    url: "http://{{ network_ipv4_address }}:{{ radarr_port }}/api/v3/rootfolder"
    api_key: "{{ radarr_api_key }}"
    key: "path"
    resources: "{{ radarr_root_folders | map('community.general.dict_kv', 'path') }}"
    prune: true

- name: "Manage radarr download clients"
  servarr_resources:
    url: "http://{{ network_ipv4_address }}:{{ radarr_port }}/api/v3/downloadclient"
    api_key: "{{ radarr_api_key }}"
    resources: "{{ [radarr_download_client] }}"
    prune: true
  no_log: true   # password

# Registered from here, once Radarr is up: Prowlarr tests an app's connection when adding it
- name: "Register radarr in prowlarr"
  servarr_resources:
    url: "{{ radarr_prowlarr.url }}/api/v1/applications"
    api_key: "{{ radarr_prowlarr.api_key }}"
    resources: "{{ [radarr_prowlarr_application] }}"
    prune: false   # only this app's entry
  when: radarr_prowlarr is defined
  no_log: true   # API keys
