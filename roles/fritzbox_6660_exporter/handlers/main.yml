---
- name: "Restart fritzbox_6660_exporter"
  become: true
  ansible.builtin.systemd_service:
    name: "fritzbox_6660_exporter"
    state: "restarted"
    daemon_reload: true

- name: "Restart fritzbox_6660_exporter log shipper timer"
  become: true
  ansible.builtin.systemd_service:
    name: "fritzbox_6660_exporter_log_shipper.timer"
    state: "restarted"
    daemon_reload: true
