---
fritzbox_6660_exporter_install_dir: "/opt/fritzbox_6660_exporter"
fritzbox_6660_exporter_port: 9042
fritzbox_6660_exporter_listen_address: "0.0.0.0:{{ fritzbox_6660_exporter_port }}"

# Base UI URL for the lua API (cable/DOCSIS metrics); derived from the TR-064
# URL by dropping the port.
fritzbox_6660_exporter_gateway_luaurl: "{{ fritzbox_6660_exporter_gateway_url | regex_replace(':[0-9]+$', '') }}"
