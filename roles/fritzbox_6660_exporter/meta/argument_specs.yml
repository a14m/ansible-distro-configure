---
argument_specs:
  main:
    options:
      fritzbox_6660_exporter_install_dir:
        type: "str"
        default: "/opt/fritzbox_6660_exporter"
        description: "Directory for the binary and metric definition files"
      fritzbox_6660_exporter_port:
        type: "int"
        default: 9042
        description: "Port the exporter serves /metrics on"
      fritzbox_6660_exporter_listen_address:
        type: "str"
        default: "0.0.0.0:9042"
        description: "host:port the exporter binds to"
      fritzbox_6660_exporter_gateway_url:
        type: "str"
        required: true
        description: "TR-064 URL of the Fritz!Box, e.g. http://192.168.178.1:49000"
      fritzbox_6660_exporter_gateway_luaurl:
        type: "str"
        description: "Base UI URL for the Fritz!Box lua API (cable/DOCSIS metrics)"
      fritzbox_6660_exporter_username:
        type: "str"
        required: true
        description: "Dedicated Fritz!Box user with the 'FRITZ!Box Settings' permission"
      fritzbox_6660_exporter_password:
        type: "str"
        required: true
        description: "Password for the Fritz!Box user"
