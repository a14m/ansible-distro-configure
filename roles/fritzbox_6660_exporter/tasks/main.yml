---
- name: "Create fritzbox_6660_exporter group"
  become: true
  ansible.builtin.group:
    name: "fritzbox_6660_exporter"
    system: true

- name: "Create fritzbox_6660_exporter user"
  become: true
  ansible.builtin.user:
    name: "fritzbox_6660_exporter"
    group: "fritzbox_6660_exporter"
    system: true
    shell: "/usr/sbin/nologin"
    create_home: false

- name: "Create fritzbox_6660_exporter directory"
  become: true
  ansible.builtin.file:
    path: "{{ fritzbox_6660_exporter_install_dir }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: "Check if fritzbox_6660_exporter is installed"
  ansible.builtin.stat:
    path: "{{ fritzbox_6660_exporter_install_dir }}/fritzbox_exporter"
  register: fritzbox_6660_exporter_binary

- name: "Install fritzbox_6660_exporter"
  become: true
  when: not fritzbox_6660_exporter_binary.stat.exists
  vars:
    fritzbox_6660_exporter_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'arm'}[ansible_facts.architecture] }}
  ansible.builtin.unarchive:
    src: >-
      https://github.com/sberk42/fritzbox_exporter/releases/download/latest/fritzbox_exporter-latest-linux-{{
      fritzbox_6660_exporter_arch }}.tar.gz
    dest: "{{ fritzbox_6660_exporter_install_dir }}"
    remote_src: true
    owner: "root"
    group: "root"
  notify: "Restart fritzbox_6660_exporter"

- name: "Deploy cable lua metrics definition"
  become: true
  ansible.builtin.copy:
    src: "metrics-lua_cable.json"
    dest: "{{ fritzbox_6660_exporter_install_dir }}/metrics-lua_cable.json"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart fritzbox_6660_exporter"

- name: "Create fritzbox_6660_exporter environment file"
  become: true
  ansible.builtin.template:
    src: "fritzbox_6660_exporter.env.j2"
    dest: "/etc/fritzbox_6660_exporter.env"
    owner: "root"
    group: "fritzbox_6660_exporter"
    mode: "0640"
  no_log: true
  notify: "Restart fritzbox_6660_exporter"

- name: "Deploy fritzbox_6660_exporter service"
  become: true
  ansible.builtin.template:
    src: "fritzbox_6660_exporter.service.j2"
    dest: "/etc/systemd/system/fritzbox_6660_exporter.service"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart fritzbox_6660_exporter"

- name: "Start and enable fritzbox_6660_exporter"
  become: true
  ansible.builtin.systemd_service:
    name: "fritzbox_6660_exporter"
    state: "started"
    enabled: true
    daemon_reload: true
