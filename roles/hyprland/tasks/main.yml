---
- name: "Detect NVIDIA driver"
  ansible.builtin.command:
    cmd: "modinfo nvidia"
  register: "hyprland_nvidia_detected"
  changed_when: false
  failed_when: false

- name: "Ensure hyprland packages are installed"
  become: true
  ansible.builtin.package:
    name:
      - "swaybg"
      - "hyprlock"
      - "hyprpicker"
      - "hyprsunset"
      - "hyprshot"
      - "satty"
      - "hyprland"
    state: "present"

- name: "Ensure hyprland AUR packages are installed"
  become: true
  become_user: "aur_builder"
  kewlfft.aur.aur:
    name: "{{ item }}"
    state: "present"
    use: "yay"
  loop:
    - "hyprshutdown"

- name: "Configure greetd"
  become: true
  ansible.builtin.copy:
    dest: "/etc/greetd/config.toml"
    owner: "greeter"
    group: "greeter"
    mode: "0644"
    content: |
      [terminal]
      vt = 2
      [default_session]
      command = "tuigreet -c 'uwsm start hyprland.desktop' --theme=border=cyan"
      user = "greeter"
  notify:
    - "Restart greetd"

- name: "Create config directories"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    mode: "0755"
  loop:
    - "/etc/hypr"
    - "/etc/hypr/scripts"
    - "/etc/xdg/uwsm"
    - "/etc/xdg/xdg-desktop-portal"
    - "{{ ansible_facts.env.HOME }}/.config/hypr"

- name: "Configure system defaults"
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - src: "hypr/autostart.lua.j2"
      dest: "/etc/hypr/autostart.lua"
    - src: "hypr/monitors.lua.j2"
      dest: "/etc/hypr/monitors.lua"
    - src: "hypr/input.lua.j2"
      dest: "/etc/hypr/input.lua"
    - src: "hypr/bindings.lua.j2"
      dest: "/etc/hypr/bindings.lua"
    - src: "hypr/looknfeel.lua.j2"
      dest: "/etc/hypr/looknfeel.lua"
    - src: "hypr/rules.lua.j2"
      dest: "/etc/hypr/rules.lua"
    - src: "hypr/hyprlock.conf.j2"
      dest: "/etc/hypr/hyprlock.conf"
    - src: "hypr/hyprland.lua.j2"
      dest: "/etc/hypr/hyprland.lua"
    - src: "uwsm/env.j2"
      dest: "/etc/xdg/uwsm/env"
    - src: "uwsm/env-hyprland.j2"
      dest: "/etc/xdg/uwsm/env-hyprland"
    - src: "xdg-desktop-portal/portals.conf.j2"
      dest: "/etc/xdg/xdg-desktop-portal/portals.conf"

- name: "Configure user defaults"
  block:
    - name: "Configure user hyprland configuration"
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts.env.HOME }}/.config/hypr/hyprland.lua"
        state: "present"
        prepend_newline: true
        append_newline: true
        marker: "-- ==== {mark} ANSIBLE HYPRLAND CONFIG"
        block: |
          -- System defaults
          require("/etc/hypr/hyprland.lua")

- name: "Copy hyprland scripts"
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0755"
  loop:
    - src: "scripts/brightness.sh"
      dest: "/etc/hypr/scripts/brightness.sh"
    - src: "scripts/volume.sh"
      dest: "/etc/hypr/scripts/volume.sh"
    - src: "scripts/sunset.sh"
      dest: "/etc/hypr/scripts/sunset.sh"
    - src: "scripts/wifi.sh"
      dest: "/etc/hypr/scripts/wifi.sh"
    - src: "scripts/bluetooth.sh"
      dest: "/etc/hypr/scripts/bluetooth.sh"
    - src: "scripts/power.sh"
      dest: "/etc/hypr/scripts/power.sh"
    - src: "scripts/screenshot.sh"
      dest: "/etc/hypr/scripts/screenshot.sh"
