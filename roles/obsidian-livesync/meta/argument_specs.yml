---
argument_specs:
  main:
    options:
      obsidian_livesync_vaults:
        type: "list"
        elements: "dict"
        description: "Vaults to configure, each synced against its own CouchDB database"
        required: true
        options:
          path:
            type: "str"
            required: true
            description: "Filesystem path to the vault (e.g. '{{ ansible_facts.env.HOME }}/obsidian')"
          dbname:
            type: "str"
            required: true
            description: "CouchDB database to sync against - obsidian_livesync_user must be one of its members"
      obsidian_livesync_uri:
        type: "str"
        description: >-
          CouchDB URI (e.g. 'https://notes.internal') - must be HTTPS for Obsidian Mobile.
          This is the couchdb role's proxied hostname, not couchdb_bind_address directly.
        required: true
      obsidian_livesync_user:
        type: "str"
        description: "CouchDB user to authenticate as - one entry of the couchdb role's couchdb_users"
        required: true
      obsidian_livesync_password:
        type: "str"
        description: "Password for obsidian_livesync_user"
        required: true
      obsidian_livesync_passphrase:
        type: "str"
        description: >-
          End-to-end encryption passphrase. Always enabled by this role - the
          remote only ever sees ciphertext, including file/folder names
          (usePathObfuscation is also always enabled alongside it).
        required: true
