---
- name: "Include OS-specific variables"
  ansible.builtin.include_vars: "{{ ansible_facts.os_family | lower }}.yml"

- name: "Ensure prometheus-node-exporter is installed"
  become: true
  ansible.builtin.package:
    name: "prometheus-node-exporter"
    state: "present"

# Recommended via collectors -> ipmitool; its service fails on every boot without a BMC
- name: "Ensure openipmi is removed"
  become: true
  when: ansible_facts.os_family == "Debian"
  ansible.builtin.apt:
    name: "openipmi"
    state: "absent"
    purge: true

# Recommended via collectors -> nvme-cli; NVMe-over-Fabrics autoconnect is unused
# and fails on kernels without nvme-fabrics (e.g. Raspberry Pi)
- name: "Ensure nvmf-autoconnect is masked"
  become: true
  when: ansible_facts.os_family == "Debian"
  ansible.builtin.systemd_service:
    name: "nvmf-autoconnect"
    masked: true

- name: "Configure node-exporter host/port via environment file"
  become: true
  ansible.builtin.copy:
    content: |
      NODE_EXPORTER_ARGS="
        --web.listen-address={{ node_exporter_host }}:{{ node_exporter_port }}
        --collector.systemd
      "
    dest: "{{ node_exporter_env_file }}"
    mode: "0644"
  notify: "Restart node-exporter"

- name: "Start and enable prometheus-node-exporter"
  become: true
  ansible.builtin.systemd_service:
    name: "prometheus-node-exporter"
    state: "started"
    enabled: true
