---
argument_specs:
  main:
    options:
      jellyfin_local_networks:
        type: "list"
        elements: "str"
        description: "Subnets Jellyfin treats as local (e.g. 192.168.0.0/24); others are refused (no remote access)"
        required: true
      jellyfin_known_proxies:
        type: "list"
        elements: "str"
        description: "Reverse proxy IPs whose X-Forwarded-For is trusted for the client IP"
        default: []
      jellyfin_hostname:
        type: "str"
        description: "FQDN for the web UI vhost on the proxy (e.g. streaming.internal). Unset skips the vhost."
      jellyfin_port:
        type: "int"
        description: "HTTP port (on network_ipv4_address)"
        default: 8096
