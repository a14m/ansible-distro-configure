---
argument_specs:
  main:
    options:
      vhost_name:
        type: "str"
        description: "Short slug used for the nginx/caddy config filename"
        required: true
      vhost_nginx_content:
        type: "str"
        description: >-
          Fully-rendered nginx vhost config content. Pass
          "{{ lookup('template', '<name>.nginx.conf.j2') }}" so the
          calling role renders its own template with its own vars.
        required: true
      vhost_caddy_content:
        type: "str"
        description: >-
          Fully-rendered caddy vhost config content. Pass
          "{{ lookup('template', '<name>.caddy.j2') }}" so the
          calling role renders its own template with its own vars.
        required: true
      vhost_proxy_host:
        type: "str"
        description: "Inventory host the vhost config is written to and the proxy service is restarted on"
        required: true
