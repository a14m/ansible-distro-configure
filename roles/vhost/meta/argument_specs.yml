---
argument_specs:
  main:
    options:
      vhost_name:
        type: "str"
        description: "Short slug used for the nginx/caddy config filename"
        required: true
      vhost_nginx_content:
        type: "str"
        description: >-
          Fully-rendered nginx vhost config content. Pass
          {% raw %}"{{ lookup('template', '<name>.nginx.conf.j2') }}"{% endraw %}
          so the calling role renders its own template with its own vars.
        required: true
      vhost_caddy_content:
        type: "str"
        description: >-
          Fully-rendered caddy vhost config content. Pass
          {% raw %}"{{ lookup('template', '<name>.caddy.j2') }}"{% endraw %}
          so the calling role renders its own template with its own vars.
        required: true
      vhost_proxy_host:
        type: "str"
        description: "Inventory host the vhost config is written to and the proxy service is restarted on"
        required: true
      vhost_proxy_type:
        type: "str"
        description: >-
          The reverse proxy in use ("nginx" or "caddy") on vhost_proxy_host.
          Passed explicitly by the caller rather than looked up via
          hostvars, since proxy_type is often only a play-level var.
        required: true
        choices:
          - "nginx"
          - "caddy"
