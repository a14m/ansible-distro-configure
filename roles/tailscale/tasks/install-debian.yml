---
- name: "Download Tailscale GPG key"
  become: true
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_facts.distribution | lower }}/\
      {{ ansible_facts.distribution_release }}.noarmor.gpg"
    dest: "/usr/share/keyrings/tailscale-archive-keyring.gpg"
    mode: "0644"

- name: "Add Tailscale repository"
  become: true
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_facts.distribution | lower }}/\
      {{ ansible_facts.distribution_release }}.tailscale-keyring.list"
    dest: "/etc/apt/sources.list.d/tailscale.list"
    mode: "0644"

- name: "Update package cache"
  become: true
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

- name: "Ensure tailscale is installed"
  become: true
  ansible.builtin.package:
    name: "tailscale"
    state: "present"

- name: "Enable and start tailscale"
  become: true
  ansible.builtin.systemd_service:
    name: "tailscaled"
    enabled: true
    state: "started"
