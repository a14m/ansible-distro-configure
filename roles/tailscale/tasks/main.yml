---
- name: "Include OS-specific installation tasks"
  ansible.builtin.include_tasks: "install-{{ ansible_facts.os_family | lower }}.yml"

- name: "Flush handlers before checking Tailscale status"
  # A pinned-port restart (notified above) must apply before the status/connect
  # tasks below observe or act on the daemon.
  ansible.builtin.meta: flush_handlers

- name: "Enable IPv4 forwarding for subnet routing"
  become: true
  ansible.posix.sysctl:
    name: "net.ipv4.ip_forward"
    value: "1"
    sysctl_set: true
    state: "present"
    reload: true
  when: tailscale_advertise_routes | length > 0

- name: "Check tailscale connection status"
  become: true
  ansible.builtin.command:
    cmd: "tailscale status"
  register: tailscale_status_check
  changed_when: false
  failed_when: false

- name: "Connect to Tailscale"
  become: true
  ansible.builtin.command:
    argv:
      - "tailscale"
      - "up"
      - "--reset"
      - "--auth-key={{ tailscale_auth_key }}"
      - "--accept-dns=false"
      - "--advertise-routes={{ tailscale_advertise_routes | join(',') }}"
      - "{{ '--advertise-exit-node' if tailscale_exit_node else omit }}"
  when: '"Logged in" not in tailscale_status_check.stdout'
  changed_when: true
  no_log: true
  tags:
    # Requires a real auth key and outbound connectivity to Tailscale's
    # control servers — not available/desired in a molecule container
    - "molecule-notest"
