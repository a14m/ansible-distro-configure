---
- name: "Set management IP in /etc/hosts for PVE cert generation"
  become: true
  ansible.builtin.template:
    src: "hosts.j2"
    dest: "/etc/hosts"
    owner: "root"
    group: "root"
    mode: "0644"
  tags:
    # pveproxy not available in containers — requires proxmox-ve package
    - "molecule-notest"

- name: "Configure Proxmox repos"
  become: true
  when: pve_repo == "no-subscription"
  block:
    - name: "Configure no-subscription repos"
      ansible.builtin.deb822_repository:
        name: "pve-no-subscription"
        types: "deb"
        uris: "http://download.proxmox.com/debian/pve"
        suites: "{{ ansible_facts.distribution_release }}"
        components: "pve-no-subscription"
        signed_by: "/usr/share/keyrings/proxmox-archive-keyring.gpg"
        state: "present"
        install_python_debian: true

    # PVE 8 installs these as .list, PVE 9 as .sources
    - name: "Remove Proxmox enterprise repos"
      ansible.builtin.file:
        path: "/etc/apt/sources.list.d/{{ item }}"
        state: "absent"
      loop:
        - "pve-enterprise.list"
        - "pve-enterprise.sources"
        - "ceph.list"
        - "ceph.sources"

# Must run after "Configure Proxmox repos": update_cache fails (401) if an
# enterprise repo file exists, e.g. the pve-enterprise.sources PVE 9 ships.
- name: "Install proxmox-ve"
  become: true
  ansible.builtin.apt:
    name: "proxmox-ve"
    state: "present"
    update_cache: true
  tags:
    # proxmox-ve package configures grub/kernel hooks which fail inside containers
    - "molecule-notest"

- name: "Create PVE admin user"
  become: true
  ansible.builtin.command:
    cmd: "pveum user add {{ pve_admin_user }}@pve"
  register: pve_user_add
  changed_when: pve_user_add.rc == 0
  failed_when: pve_user_add.rc != 0 and 'already exists' not in pve_user_add.stderr
  tags:
    # pveum binary not available in containers — requires proxmox-ve package
    - "molecule-notest"

- name: "Set PVE admin user password"
  become: true
  no_log: true
  ansible.builtin.command:
    cmd: "pveum passwd {{ pve_admin_user }}@pve --password {{ pve_admin_password }}"
  changed_when: true
  tags:
    # pveum binary not available in containers — requires proxmox-ve package
    - "molecule-notest"

- name: "Grant PVE Administrator role"
  become: true
  ansible.builtin.command:
    cmd: "pveum acl modify / --roles Administrator --users {{ pve_admin_user }}@pve"
  changed_when: true
  tags:
    # pveum binary not available in containers — requires proxmox-ve package
    - "molecule-notest"

- name: "Enable and start Proxmox VE services"
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: "started"
  loop:
    - "pve-cluster"
    - "pvedaemon"
    - "pveproxy"
    - "pvestatd"
  tags:
    # PVE services not available in containers — proxmox-ve package was skipped
    - "molecule-notest"

- name: "Create PVE proxy vhost"
  when: pve_hostname is defined
  ansible.builtin.include_role:
    name: "vhost"
  vars:
    vhost_name: "pve"
    vhost_nginx_content: "{{ lookup('template', 'pve.nginx.conf.j2') }}"
    vhost_caddy_content: "{{ lookup('template', 'pve.caddy.j2') }}"
