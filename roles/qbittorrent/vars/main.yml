---
qbittorrent_base_settings:
  - { section: "LegalNotice", option: "Accepted", value: "true" }
  - { section: "BitTorrent", option: 'Session\Interface', value: "{{ qbittorrent_vpn_connection }}" }
  - { section: "BitTorrent", option: 'Session\InterfaceName', value: "{{ qbittorrent_vpn_connection }}" }
  - { section: "BitTorrent", option: 'Session\LSDEnabled', value: "false" }   # Local Service Discovery on the LAN
  - { section: "BitTorrent", option: 'Session\DefaultSavePath', value: "{{ qbittorrent_save_path }}" }
  # Automatic torrent management: a torrent with a category is saved in <save path>/<category>
  - { section: "BitTorrent", option: 'Session\DisableAutoTMMByDefault', value: "false" }
  - { section: "BitTorrent", option: 'Session\GlobalMaxRatio', value: "{{ qbittorrent_max_ratio }}" }   # then stops
  - { section: "Preferences", option: 'WebUI\Address', value: "{{ network_ipv4_address }}" }
  - { section: "Preferences", option: 'WebUI\Port', value: "{{ qbittorrent_webui_port }}" }
  - { section: "Preferences", option: 'WebUI\Username', value: "{{ qbittorrent_username }}" }
  - section: "Preferences"
    option: 'WebUI\Password_PBKDF2'
    value: '"@ByteArray({{ qbittorrent_password_hash.stdout }})"'

# Logins arrive from the proxy: trust its X-Forwarded-For so failed logins ban the client, not the proxy
qbittorrent_proxy_settings:
  - { section: "Preferences", option: 'WebUI\ReverseProxySupportEnabled', value: "true" }
  - { section: "Preferences", option: 'WebUI\TrustedReverseProxiesList', value: "{{ qbittorrent_trusted_proxy }}" }

qbittorrent_settings: >-
  {{ qbittorrent_base_settings + (qbittorrent_proxy_settings if qbittorrent_trusted_proxy is defined else []) }}
