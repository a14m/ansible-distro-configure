---
argument_specs:
  main:
    options:
      qbittorrent_hostname:
        type: "str"
        description: "FQDN for the web UI vhost on the proxy (e.g. downloads.internal). Unset skips the vhost."
      qbittorrent_vpn_connection:
        type: "str"
        description: "WireGuard interface torrent traffic is bound to"
        default: "{{ wireguard_autostart_connection }}"
      qbittorrent_webui_port:
        type: "int"
        description: "Port for the web UI to bind on network_ipv4_address"
        default: 8080
      qbittorrent_trusted_proxy:
        type: "str"
        description: "Reverse proxy IP whose X-Forwarded-For header is trusted for the client IP (login bans)"
        default: "{{ hostvars[vhost_proxy_host].network_ipv4_address }}"
      qbittorrent_webui_username:
        type: "str"
        description: "Web UI username"
        default: "admin"
      qbittorrent_webui_password_pbkdf2:
        type: "str"
        description: "Web UI password as qBittorrent's 'base64(salt):base64(hash)' PBKDF2-SHA512 string (see README)"
        required: true
        no_log: true
