---
argument_specs:
  main:
    options:
      qbittorrent_hostname:
        type: "str"
        description: "FQDN for the web UI vhost on the proxy (e.g. downloads.internal). Unset skips the vhost."
      qbittorrent_vpn_connection:
        type: "str"
        description: "WireGuard interface torrent traffic is bound to (e.g. wg-vpn)"
        required: true
      qbittorrent_save_path:
        type: "str"
        description: "Directory torrents download to"
        default: "/var/lib/qbittorrent/Downloads"
      qbittorrent_group:
        type: "str"
        description: "Primary group of the qbittorrent user, owning downloads (e.g. a shared 'media' group)"
        default: "qbittorrent"
      qbittorrent_group_id:
        type: "int"
        description: "GID for qbittorrent_group, to match it across containers sharing a bind mount"
      qbittorrent_max_ratio:
        type: "float"
        description: "Share ratio after which torrents stop seeding (-1 for no limit)"
        default: -1
      qbittorrent_webui_port:
        type: "int"
        description: "Port for the web UI to bind on network_ipv4_address"
        default: 8080
      qbittorrent_trusted_proxy:
        type: "str"
        description: >-
          Reverse proxy IP whose X-Forwarded-For header is trusted for the client IP, so failed logins ban the client
          instead of the proxy. Unset leaves reverse proxy support off.
      qbittorrent_username:
        type: "str"
        description: "Web UI username"
        default: "admin"
      qbittorrent_password:
        type: "str"
        description: "Web UI password (plaintext); stored by qBittorrent as a PBKDF2-SHA512 hash"
        required: true
        no_log: true
