---
- name: "Ensure qbittorrent-nox is installed"
  become: true
  ansible.builtin.apt:
    name: "qbittorrent-nox"
    state: "present"
    install_recommends: false

# A shared group (e.g. "media", same GID in every container using a bind-mounted /data) lets other services
# read and import downloads
- name: "Create qbittorrent group"
  become: true
  ansible.builtin.group:
    name: "{{ qbittorrent_group }}"
    gid: "{{ qbittorrent_group_id | default(omit) }}"
    system: true

- name: "Create qbittorrent user"
  become: true
  ansible.builtin.user:
    name: "qbittorrent"
    group: "{{ qbittorrent_group }}"
    system: true
    shell: "/usr/sbin/nologin"
    home: "/var/lib/qbittorrent"
    create_home: true

# Created here so they're owned by qbittorrent
- name: "Ensure qbittorrent config directories exist"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "qbittorrent"
    group: "{{ qbittorrent_group }}"
    mode: "0700"
  loop:
    - "/var/lib/qbittorrent/.config"
    - "/var/lib/qbittorrent/.config/qBittorrent"

- name: "Ensure qbittorrent download directory exists"
  become: true
  ansible.builtin.file:
    path: "{{ qbittorrent_save_path }}"
    state: "directory"
    owner: "qbittorrent"
    group: "{{ qbittorrent_group }}"
    mode: "2775"   # setgid: new files keep the group

# New files group-writable, so services sharing the group can import (hardlink) and clean up downloads
- name: "Ensure qbittorrent service drop-in directory exists"
  become: true
  ansible.builtin.file:
    path: "/etc/systemd/system/qbittorrent-nox@qbittorrent.service.d"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: "Set qbittorrent umask"
  become: true
  ansible.builtin.copy:
    dest: "/etc/systemd/system/qbittorrent-nox@qbittorrent.service.d/umask.conf"
    content: |
      [Service]
      UMask=0002
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart qbittorrent"

# qBittorrent's own format: base64(salt):base64(PBKDF2-SHA512, 100000 rounds, 64 bytes). The salt comes from the host
# and password instead of being random, so the hash, and with it the config, only changes when the password does.
- name: "Hash qbittorrent web UI password"
  ansible.builtin.command:
    argv:
      - "python3"
      - "-c"
      - |
        import base64, hashlib, sys
        salt = bytes.fromhex(sys.argv[1][:32])
        key = hashlib.pbkdf2_hmac("sha512", sys.stdin.read().encode(), salt, 100000, 64)
        print(base64.b64encode(salt).decode() + ":" + base64.b64encode(key).decode())
      - "{{ (inventory_hostname ~ qbittorrent_password) | hash('sha256') }}"
    stdin: "{{ qbittorrent_password }}"
    stdin_add_newline: false
  register: qbittorrent_password_hash
  changed_when: false
  check_mode: false
  no_log: true

# qBittorrent rewrites its config on exit, so settings are only written while it's stopped
- name: "Check qbittorrent settings"
  become: true
  community.general.ini_file:
    path: "/var/lib/qbittorrent/.config/qBittorrent/qBittorrent.conf"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    owner: "qbittorrent"
    group: "{{ qbittorrent_group }}"
    mode: "0600"
  loop: "{{ qbittorrent_settings }}"
  loop_control:
    label: "{{ item.section }}/{{ item.option }}"
  check_mode: true
  register: qbittorrent_settings_check

- name: "Stop qbittorrent before changing its settings"
  become: true
  ansible.builtin.systemd_service:
    name: "qbittorrent-nox@qbittorrent"
    state: "stopped"
  when: qbittorrent_settings_check is changed
  # noqa: no-handler stop, apply and start must run in this order, before the role continues

- name: "Apply qbittorrent settings"
  become: true
  community.general.ini_file:
    path: "/var/lib/qbittorrent/.config/qBittorrent/qBittorrent.conf"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    owner: "qbittorrent"
    group: "{{ qbittorrent_group }}"
    mode: "0600"
  loop: "{{ qbittorrent_settings }}"
  loop_control:
    label: "{{ item.section }}/{{ item.option }}"
  when: qbittorrent_settings_check is changed
  # noqa: no-handler stop, apply and start must run in this order, before the role continues

- name: "Ensure qbittorrent is enabled and running"
  become: true
  ansible.builtin.systemd_service:
    name: "qbittorrent-nox@qbittorrent"
    enabled: true
    state: "started"

- name: "Create qbittorrent proxy vhost"
  when: qbittorrent_hostname is defined
  tags:
    - "vhost"
  ansible.builtin.include_role:
    name: "vhost"
  vars:
    vhost_name: "qbittorrent"
    vhost_nginx_content: "{{ lookup('template', 'qbittorrent.nginx.conf.j2') }}"
    vhost_caddy_content: "{{ lookup('template', 'qbittorrent.caddy.j2') }}"
