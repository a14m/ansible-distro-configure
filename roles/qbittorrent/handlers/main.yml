---
- name: "Restart qbittorrent"
  become: true
  ansible.builtin.systemd_service:
    name: "qbittorrent-nox@qbittorrent"
    state: "restarted"
    daemon_reload: true

- name: "Restart qbittorrent-natpmp"
  become: true
  ansible.builtin.systemd_service:
    name: "qbittorrent-natpmp"
    state: "restarted"
    daemon_reload: true

- name: "Reload systemd"
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
