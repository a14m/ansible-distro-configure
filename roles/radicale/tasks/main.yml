---
- name: "Create radicale group"
  become: true
  ansible.builtin.group:
    name: "radicale"
    system: true

- name: "Create radicale user"
  become: true
  ansible.builtin.user:
    name: "radicale"
    group: "radicale"
    system: true
    shell: "/usr/sbin/nologin"
    create_home: false

- name: "Include OS-specific installation tasks"
  ansible.builtin.include_tasks: "install-{{ ansible_facts.os_family | lower }}.yml"

- name: "Create radicale storage directory"
  become: true
  ansible.builtin.file:
    path: "{{ radicale_storage_dir }}"
    state: "directory"
    owner: "radicale"
    group: "radicale"
    mode: "0750"

- name: "Ensure per-user collection directories exist"
  become: true
  ansible.builtin.file:
    path: "{{ radicale_storage_dir }}/collection-root/{{ item.name }}"
    state: "directory"
    owner: "radicale"
    group: "radicale"
    mode: "0750"
  loop: "{{ radicale_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Symlink shared collections into member accounts"
  become: true
  vars:
    collection: "{{ item.0 }}"
    member: "{{ item.1 }}"
  ansible.builtin.file:
    src: "{{ radicale_storage_dir }}/collection-root/{{ collection.owner }}/{{ collection.collection }}"
    dest: "{{ radicale_storage_dir }}/collection-root/{{ member }}/{{ collection.collection }}"
    state: "link"
    force: true
    follow: false
    owner: "radicale"
    group: "radicale"
  loop: "{{ radicale_collections | subelements('members', skip_missing=True) }}"
  loop_control:
    label: "{{ member }}/{{ collection.collection }}"

- name: "Create radicale configuration file"
  become: true
  ansible.builtin.template:
    src: "config.j2"
    dest: "/etc/radicale/config"
    owner: "root"
    group: "radicale"
    mode: "0640"
  notify: "Restart radicale"

- name: "Create radicale rights file"
  become: true
  ansible.builtin.template:
    src: "rights.j2"
    dest: "/etc/radicale/rights"
    owner: "root"
    group: "radicale"
    mode: "0640"
  notify: "Restart radicale"

- name: "Create radicale htpasswd users file"
  become: true
  ansible.builtin.template:
    src: "users.j2"
    dest: "/etc/radicale/users"
    owner: "root"
    group: "radicale"
    mode: "0640"
  no_log: true
  notify: "Restart radicale"

- name: "Start and enable radicale"
  become: true
  ansible.builtin.service:
    name: "radicale"
    state: "started"
    enabled: true

- name: "Create radicale nginx vhost configuration on proxy"
  become: true
  delegate_to: "proxy.home.arpa"
  when: radicale_hostname | length > 0 and hostvars['proxy.home.arpa'].proxy_type == "nginx"
  ansible.builtin.template:
    src: "radicale.nginx.conf.j2"
    dest: "/etc/nginx/conf.d/radicale.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart proxy"

- name: "Create radicale caddy configuration on proxy"
  become: true
  delegate_to: "proxy.home.arpa"
  when: radicale_hostname | length > 0 and hostvars['proxy.home.arpa'].proxy_type == "caddy"
  ansible.builtin.template:
    src: "radicale.caddy.j2"
    dest: "/etc/caddy/sites/radicale.caddy"
    owner: "root"
    group: "caddy"
    mode: "0640"
  notify: "Restart proxy"
