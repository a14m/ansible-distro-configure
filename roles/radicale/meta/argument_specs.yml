---
argument_specs:
  main:
    options:
      radicale_hostname:
        type: "str"
        description: >-
          FQDN for radicale (e.g. caldav.example.com).
          Leave undefined to skip vhost creation entirely.
      radicale_port:
        type: "int"
        description: "Port for the radicale server to bind on network_ipv4_address"
        default: 5232
      radicale_storage_dir:
        type: "str"
        description: "Filesystem path where radicale stores collections"
        default: "/var/lib/radicale/collections"
      radicale_auth_delay:
        type: "int"
        description: "Seconds throttled (average) after each failed/denied login attempt"
        default: 3
      radicale_users:
        type: "list"
        elements: "dict"
        description: "List of {name, password_hash} dicts written as 'name:password_hash' lines to /etc/radicale/users."
        default: []
      radicale_rights_rules:
        type: "list"
        elements: "dict"
        description: "List of {name, user, collection, permissions} rules written to /etc/radicale/rights"
        default:
          - name: "root"
            user: ".+"
            collection: ""
            permissions: "R"
          - name: "owner-only"
            user: ".+"
            collection: "{user}(/.*)?"
            permissions: "RWrw"
      radicale_collections:
        type: "list"
        elements: "dict"
        description: >-
          List of {owner, collection, members} dicts. For each entry, symlinks
          `collection` (a flat name under the owner's own collection directory)
          into every listed member's own collection tree, so it appears as one of
          their own calendars/address books. See README for the sharing model.
        default: []
