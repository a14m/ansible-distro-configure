---
- name: "Rebuild initramfs"
  # kernel-install-sync (from distro-install or the kernel_install role) rebuilds the ESP initrd systemd-boot reads;
  # without it this is a plain mkinitcpio setup.
  become: true
  ansible.builtin.shell:
    cmd: |
      if [ -x /usr/local/bin/kernel-install-sync ]; then
        exec /usr/local/bin/kernel-install-sync
      else
        exec mkinitcpio -P
      fi
  changed_when: true
