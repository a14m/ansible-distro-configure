---
- name: "Rebuild initramfs"
  become: true
  ansible.builtin.command:
    cmd: "mkinitcpio -P"
  changed_when: true
  notify: "Sync kernel to EFI partition"

- name: "Sync kernel to EFI partition"
  # This desktop boots via systemd-boot, reading the kernel/initramfs straight from the ESP
  # (see ansible-distro-install roles/bootstrap). kernel-install's pacman hook only re-syncs
  # the ESP on `linux` package upgrades, not on a manual mkinitcpio rebuild like this one, so
  # skipping this step leaves systemd-boot booting a stale initramfs (e.g. missing this role's
  # nouveau blacklist) until the next kernel upgrade happens to trigger the hook.
  become: true
  ansible.builtin.command:
    cmd: "kernel-install add-all"
  changed_when: true
