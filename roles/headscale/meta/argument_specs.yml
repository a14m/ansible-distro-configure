---
argument_specs:
  main:
    options:
      headscale_hostname:
        type: "str"
        description: >-
          FQDN clients connect to (e.g. hs.example.com). Drives server_url (always https://) and
          the proxy vhost fronting headscale_port - headscale itself serves plain HTTP, this is
          what terminates real TLS.
        required: true
      headscale_version:
        type: "str"
        description: >-
          Pins the Debian/Ubuntu .deb download only - Alpine tracks whatever
          apk's edge/community repo currently has.
        default: "0.29.3"
      headscale_port:
        type: "int"
        description: >-
          Port headscale's plain-HTTP control API binds on, all interfaces - no TLS here,
          and no address to set: same "port only, ufw gates access" shape as caddy_metrics_port.
        default: 8080
      headscale_metrics_port:
        type: "int"
        description: "Port for /metrics and /debug, all interfaces - ufw gates actual access"
        default: 9090
      headscale_vhost_port:
        type: "int"
        description: >-
          Port the proxy vhost listens on for headscale specifically - not 443, which the same
          Caddy also fronts for other vhosts. Keeps this the only one reachable externally (over
          IPv6 - no NAT to hide behind, so a dedicated port is what keeps everything else on that
          Caddy LAN-only) without opening the rest of the proxy's vhosts to the internet too.
        default: 8443
      headscale_prefix_v4:
        type: "str"
        description: "IPv4 CIDR to allocate tailnet addresses from"
        default: "100.64.0.0/10"
      headscale_prefix_v6:
        type: "str"
        description: "IPv6 CIDR to allocate tailnet addresses from"
        default: "fd7a:115c:a1e0::/48"
      headscale_derp_urls:
        type: "list"
        elements: "str"
        description: "External DERP maps to use - default relies on Tailscale's public relay mesh"
        default:
          - "https://controlplane.tailscale.com/derpmap/default"
      headscale_node_expiry:
        type: "str"
        description: "Default key expiry for non-tagged nodes (e.g. '0' for never, '180d')"
        default: "0"
      headscale_users:
        type: "list"
        elements: "str"
        description: >-
          Usernames to create. Creating a user that already exists is a no-op.
          Preauth keys are not managed by this role - mint them manually with
          `headscale preauthkeys create --user <numeric id> --reusable --expiration <duration>`
          (--user takes the numeric ID from `headscale users list`, not the name).
        default: []
      headscale_policy_auto_approve_routes:
        type: "list"
        elements: "str"
        description: >-
          Subnet routes (CIDRs) auto-approved the moment a matching node first advertises them, no
          manual `headscale nodes approve-routes` needed - same mechanism Tailscale SaaS calls
          autoApprovers. Owned by a reserved "headscale" user this role always creates (not one of
          headscale_users), which is also always auto-approved for exit-node advertisement.
        default: []
