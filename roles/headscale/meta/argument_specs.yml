---
argument_specs:
  main:
    options:
      headscale_hostname:
        type: "str"
        description: "FQDN clients connect to - drives server_url and the proxy vhost"
        required: true
      headscale_version:
        type: "str"
        description: "Pins the Debian/Ubuntu .deb download - Alpine tracks apk's edge/community repo"
        default: "0.29.3"
      headscale_port:
        type: "int"
        description: "Port headscale's plain-HTTP control API binds on, all interfaces"
        default: 8080
      headscale_metrics_port:
        type: "int"
        description: "Port for /metrics and /debug, all interfaces - ufw gates actual access"
        default: 9090
      headscale_vhost_port:
        type: "int"
        description: "Port the proxy vhost uses for headscale, not 443 (shared by other vhosts)"
        default: 8443
      headscale_prefix_v4:
        type: "str"
        description: "IPv4 CIDR to allocate tailnet addresses from"
        default: "100.64.0.0/10"
      headscale_prefix_v6:
        type: "str"
        description: "IPv6 CIDR to allocate tailnet addresses from"
        default: "fd7a:115c:a1e0::/48"
      headscale_derp_urls:
        type: "list"
        elements: "str"
        description: "External DERP maps to use - default relies on Tailscale's public relay mesh"
        default:
          - "https://controlplane.tailscale.com/derpmap/default"
      headscale_node_expiry:
        type: "str"
        description: "Default key expiry for non-tagged nodes (e.g. '0' for never, '180d')"
        default: "0"
      headscale_users:
        type: "list"
        elements: "str"
        description: "Usernames to create (no-op if existing) - preauth keys aren't managed here"
        default: []
      headscale_policy_auto_approve_routes:
        type: "list"
        elements: "str"
        description: "Subnet routes auto-approved on first advertisement, no manual approval needed"
        default: []
      headscale_acme_email:
        type: "str"
        description: "Let's Encrypt account email, passed to the acme role"
        required: true
      headscale_acme_cloudflare_api_token:
        type: "str"
        description: "Cloudflare API token, scoped to Zone.DNS:Edit on the zone owning headscale_hostname"
        required: true
        no_log: true
