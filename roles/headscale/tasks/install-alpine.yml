---
- name: "Add edge community repository for headscale"
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/apk/repositories"
    line: "@edge http://dl-cdn.alpinelinux.org/alpine/edge/community"
    state: "present"

- name: "Update apk package cache"
  become: true
  community.general.apk:
    update_cache: true
  changed_when: false

- name: "Ensure headscale is installed"
  become: true
  ansible.builtin.package:
    name:
      - "headscale@edge"
      - "headscale-openrc@edge"
    state: "present"
