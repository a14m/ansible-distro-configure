---
- name: "Include OS-specific installation tasks"
  ansible.builtin.include_tasks: "install-{{ ansible_facts.os_family | lower }}.yml"

# /var/lib/headscale ownership is (re)established by the package itself on
# every start - OpenRC's init script via checkpath, systemd's unit via
# StateDirectory= - so this role does not manage that directory directly.

- name: "Deploy headscale configuration"
  become: true
  ansible.builtin.template:
    src: "config.yaml.j2"
    dest: "/etc/headscale/config.yaml"
    owner: "headscale"
    group: "headscale"
    mode: "0644"
  notify: "Restart headscale"

- name: "Deploy headscale ACL policy"
  become: true
  ansible.builtin.template:
    src: "policy.hujson.j2"
    dest: "/etc/headscale/policy.hujson"
    owner: "headscale"
    group: "headscale"
    mode: "0644"
  notify: "Restart headscale"

- name: "Start and enable headscale"
  become: true
  ansible.builtin.service:
    name: "headscale"
    state: "started"
    enabled: true

- name: "Create headscale proxy vhost"
  ansible.builtin.include_role:
    name: "vhost"
  vars:
    vhost_name: "headscale"
    vhost_nginx_content: "{{ lookup('template', 'headscale.nginx.conf.j2') }}"
    vhost_caddy_content: "{{ lookup('template', 'headscale.caddy.j2') }}"

- name: "Flush handlers before managing users"
  # headscale users/list talk to the running daemon over its local socket,
  # not the database directly - the service must already be up.
  ansible.builtin.meta: "flush_handlers"

- name: "List existing headscale users"
  become: true
  ansible.builtin.command:
    cmd: "headscale users list --output json"
  register: headscale_existing_users
  changed_when: false

# Owns auto-approved routes/exit-node - reserved, not part of headscale_users
- name: "Create reserved headscale user"
  become: true
  ansible.builtin.command:
    cmd: "headscale users create headscale"
  when: "'headscale' not in (headscale_existing_users.stdout | from_json | map(attribute='name') | list)"
  changed_when: true

- name: "Create headscale users"
  become: true
  ansible.builtin.command:
    cmd: "headscale users create {{ item }}"
  loop: "{{ headscale_users }}"
  when: item not in (headscale_existing_users.stdout | from_json | map(attribute='name') | list)
  changed_when: true
