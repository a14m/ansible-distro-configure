---
argument_specs:
  main:
    options:
      cloudflare_ddns_api_token:
        type: "str"
        description: >-
          Cloudflare API token, scoped to Zone.DNS:Edit on cloudflare_ddns_zone_id only.
          The record itself is never created by this role - point it at an existing A record.
        required: true
        no_log: true
      cloudflare_ddns_zone_id:
        type: "str"
        description: "Cloudflare zone ID that owns cloudflare_ddns_record_name"
        required: true
      cloudflare_ddns_record_name:
        type: "str"
        description: "Fully-qualified DNS A record to keep updated (e.g. hs.a14m.dev)"
        required: true
      cloudflare_ddns_fritzbox_url:
        type: "str"
        description: >-
          TR-064 URL of the Fritz!Box (e.g. http://192.168.178.1:49000). The WAN IP is read
          from here rather than this host's own egress - a host routed through a "gateway"
          role in VPN mode can have its own traffic silently rerouted through a tunnel, which
          would make egress-based detection report the VPN's IP instead of the real WAN IP.
        required: true
      cloudflare_ddns_fritzbox_username:
        type: "str"
        description: "Fritz!Box user with the 'FRITZ!Box Settings' permission"
        required: true
      cloudflare_ddns_fritzbox_password:
        type: "str"
        description: "Password for cloudflare_ddns_fritzbox_username"
        required: true
        no_log: true
      cloudflare_ddns_ttl:
        type: "int"
        description: "TTL (seconds) set on the record with every update"
        default: 120
      cloudflare_ddns_cron_schedule:
        type: "str"
        description: "cron schedule (e.g. */5 * * * *) - used on OpenRC hosts"
        default: "*/5 * * * *"
      cloudflare_ddns_systemd_schedule:
        type: "str"
        description: "systemd OnCalendar schedule (e.g. *:0/5) - used on systemd hosts"
        default: "*:0/5"
