---
- name: "Deploy cloudflare-ddns systemd service"
  become: true
  ansible.builtin.template:
    src: "cloudflare-ddns.service.j2"
    dest: "/etc/systemd/system/cloudflare-ddns.service"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Reload systemd"

- name: "Deploy cloudflare-ddns systemd timer"
  become: true
  ansible.builtin.template:
    src: "cloudflare-ddns.timer.j2"
    dest: "/etc/systemd/system/cloudflare-ddns.timer"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Reload systemd"

- name: "Enable and start cloudflare-ddns timer"
  become: true
  ansible.builtin.systemd_service:
    name: "cloudflare-ddns.timer"
    enabled: true
    state: "started"
    daemon_reload: true
