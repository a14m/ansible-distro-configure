---
argument_specs:
  main:
    options:
      cgit_hostname:
        type: "str"
        description: >-
          FQDN for cgit (e.g. git.example.com).
          Leave undefined to skip vhost creation entirely.
      cgit_clone_prefix:
        type: "str"
        description: >-
          Hostname used for the SSH clone-prefix (e.g. git.home.arpa).
          Independent of cgit_hostname, since the clone prefix is reached
          over SSH while cgit_hostname is the HTTP-only reverse-proxy vhost.
        default: "git.home.arpa"
      cgit_port:
        type: "int"
        description: "Port lighttpd listens on internally"
        default: 3000
      cgit_repos_dir:
        type: "str"
        description: "Directory containing bare git repositories"
        default: "/srv/git"
      cgit_title:
        type: "str"
        description: "cgit index page title"
        default: "git"
      cgit_description:
        type: "str"
        description: "cgit index page description"
        default: "personal git repositories"
      cgit_ssh_user:
        type: "str"
        description: "System user for SSH git push access"
        default: "git"
