---
- name: "Install packages"
  become: true
  ansible.builtin.package:
    name:
      - cgit
      - lighttpd
      - openssh
    state: present

- name: "Create git group"
  become: true
  ansible.builtin.group:
    name: "{{ cgit_ssh_user }}"
    system: true

- name: "Create git user"
  become: true
  ansible.builtin.user:
    name: "{{ cgit_ssh_user }}"
    group: "{{ cgit_ssh_user }}"
    shell: "/usr/bin/git-shell"
    create_home: true
    system: true
    password: "*"

- name: "Set default branch name for new repos"
  become: true
  community.general.git_config:
    name: init.defaultBranch
    scope: system
    value: main

- name: "Deploy authorized_keys"
  become: true
  ansible.posix.authorized_key:
    user: "{{ cgit_ssh_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ user_public_keys }}"

- name: "Create repos directory"
  become: true
  ansible.builtin.file:
    path: "{{ cgit_repos_dir }}"
    state: directory
    owner: "{{ cgit_ssh_user }}"
    group: "{{ cgit_ssh_user }}"
    mode: "2755"

- name: "Deploy cgitrc"
  become: true
  ansible.builtin.template:
    src: "cgitrc.j2"
    dest: "/etc/cgitrc"
    owner: "root"
    group: "root"
    mode: "0644"

- name: "Deploy lighttpd config"
  become: true
  ansible.builtin.template:
    src: "cgit.lighttpd.conf.j2"
    dest: "/etc/lighttpd/lighttpd.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart lighttpd"

- name: "Enable and start services"
  become: true
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - lighttpd
    - sshd

- name: "Create cgit nginx vhost configuration on proxy"
  become: true
  delegate_to: "proxy.home.arpa"
  when: cgit_hostname | length > 0 and hostvars['proxy.home.arpa'].proxy_type == "nginx"
  ansible.builtin.template:
    src: "cgit.nginx.conf.j2"
    dest: "/etc/nginx/conf.d/cgit.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart proxy"

- name: "Create cgit caddy configuration on proxy"
  become: true
  delegate_to: "proxy.home.arpa"
  when: cgit_hostname | length > 0 and hostvars['proxy.home.arpa'].proxy_type == "caddy"
  ansible.builtin.template:
    src: "cgit.caddy.j2"
    dest: "/etc/caddy/sites/cgit.caddy"
    owner: "root"
    group: "caddy"
    mode: "0640"
  notify: "Restart proxy"
