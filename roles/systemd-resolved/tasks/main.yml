---
- name: "Include OS-specific installation tasks"
  ansible.builtin.include_tasks: "install-{{ ansible_facts.os_family | lower }}.yml"

- name: "Ensure systemd-resolved is enabled and running"
  become: true
  ansible.builtin.systemd_service:
    name: "systemd-resolved"
    enabled: true
    state: "started"
  when: not ansible_facts.is_chroot

- name: "(chroot): Ensure systemd-resolved is enabled"
  ansible.builtin.command:
    cmd: "systemctl enable systemd-resolved"
  changed_when: true
  when: ansible_facts.is_chroot
  # noqa: command-instead-of-module module doesn't work inside chroot
