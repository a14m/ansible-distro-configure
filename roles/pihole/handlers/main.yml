---
- name: "Restart NetworkManager"
  become: true
  ansible.builtin.systemd_service:
    name: "NetworkManager"
    state: "restarted"

- name: "Show install output"
  ansible.builtin.debug:
    var: pihole_install.stdout

- name: "Restart pihole-FTL"
  become: true
  ansible.builtin.systemd_service:
    name: "pihole-FTL"
    state: "restarted"
