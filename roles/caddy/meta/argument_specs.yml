---
argument_specs:
  main:
    options:
      caddy_metrics_port:
        type: "str"
        description: >-
          Port for a dedicated Prometheus /metrics-only endpoint, reachable
          on the network. Separate from Caddy's admin API (always
          localhost-only, untouched) so nothing beyond metrics is exposed.
          When empty (default), no metrics endpoint is created.
        default: ""
      caddy_acme_email:
        type: "str"
        description: >-
          Email for Let's Encrypt account registration/expiry notices - only used by vhosts that
          override the default internal CA with a real ACME issuer. Empty (default) omits it.
        default: ""
      caddy_pki_root_cert:
        type: "str"
        description: >-
          PEM root pinned for the internal CA (with caddy_pki_root_key), so rebuilds keep it.
          Undefined lets Caddy generate its own.
        required: false
      caddy_pki_root_key:
        type: "str"
        description: "PEM private key for caddy_pki_root_cert"
        required: false
