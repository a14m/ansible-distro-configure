---
- name: "Install prowlarr dependencies"
  become: true
  ansible.builtin.apt:
    name:
      - "libicu76"
      - "libsqlite3-0"
      - "python3-lxml"   # for community.general.xml below
    state: "present"
    install_recommends: false

- name: "Create prowlarr group"
  become: true
  ansible.builtin.group:
    name: "prowlarr"
    system: true

- name: "Create prowlarr user"
  become: true
  ansible.builtin.user:
    name: "prowlarr"
    group: "prowlarr"
    system: true
    shell: "/usr/sbin/nologin"
    home: "/var/lib/prowlarr"
    create_home: true

# Installed once from the latest release; after that prowlarr updates itself, so the install dir is its own
- name: "Install prowlarr"
  become: true
  ansible.builtin.unarchive:
    src: "https://prowlarr.servarr.com/v1/update/master/updatefile?os=linux&runtime=netcore&arch=x64"
    dest: "/opt"
    remote_src: true
    creates: "/opt/Prowlarr/Prowlarr"
    owner: "prowlarr"
    group: "prowlarr"

- name: "Create prowlarr config file"
  become: true
  ansible.builtin.copy:
    dest: "/var/lib/prowlarr/config.xml"
    content: "<Config></Config>\n"
    force: false
    owner: "prowlarr"
    group: "prowlarr"
    mode: "0600"

# Prowlarr keeps unknown keys and adds its own, so only these are managed; everything else stays in the web UI
- name: "Set prowlarr settings"
  become: true
  community.general.xml:
    path: "/var/lib/prowlarr/config.xml"
    xpath: "/Config/{{ item.key }}"
    value: "{{ item.value | string }}"   # the xml module only takes text; the port would arrive as an int
  loop:
    - { key: "BindAddress", value: "{{ network_ipv4_address }}" }
    - { key: "Port", value: "{{ prowlarr_port }}" }
    - { key: "ApiKey", value: "{{ prowlarr_api_key }}" }
    # AuthenticationMethod stays unset so the first visit asks for the login method and user
    - { key: "AuthenticationRequired", value: "Enabled" }    # also for LAN addresses, which include the proxy
    - { key: "AllowedHosts", value: "{{ prowlarr_allowed_hosts | join(',') }}" }
    - { key: "AnalyticsEnabled", value: "False" }
    - { key: "LaunchBrowser", value: "False" }
  loop_control:
    label: "{{ item.key }}"
  no_log: "{{ item.key == 'ApiKey' }}"
  notify: "Restart prowlarr"

- name: "Install prowlarr service"
  become: true
  ansible.builtin.template:
    src: "prowlarr.service.j2"
    dest: "/etc/systemd/system/prowlarr.service"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart prowlarr"

- name: "Ensure prowlarr is enabled and running"
  become: true
  ansible.builtin.systemd_service:
    name: "prowlarr"
    enabled: true
    state: "started"
    daemon_reload: true

- name: "Create prowlarr proxy vhost"
  when: prowlarr_hostname is defined
  tags:
    - "vhost"
  ansible.builtin.include_role:
    name: "vhost"
  vars:
    vhost_name: "prowlarr"
    vhost_nginx_content: "{{ lookup('template', 'prowlarr.nginx.conf.j2') }}"
    vhost_caddy_content: "{{ lookup('template', 'prowlarr.caddy.j2') }}"
