---
- name: "Install prowlarr"
  ansible.builtin.include_role:
    name: "servarr"
    tasks_from: "app"
  vars:
    servarr_app: "prowlarr"
    servarr_download_url: "https://prowlarr.servarr.com/v1/update/master/updatefile?os=linux&runtime=netcore&arch=x64"
    servarr_port: "{{ prowlarr_port }}"
    servarr_api_key: "{{ prowlarr_api_key }}"
    servarr_group: "prowlarr"
    servarr_allowed_hosts: "{{ prowlarr_allowed_hosts }}"
    servarr_hostname: "{{ prowlarr_hostname | default(none) }}"
