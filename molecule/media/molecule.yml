---
role_name_check: 1
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml
    ignore-errors: true
driver:
  name: podman
# One network, so the containers reach each other on bindable addresses (pasta gives each the host's IP)
platforms:
  - name: downloads.home.arpa
    image: downloads
    dockerfile: Dockerfile.debian.j2
    pre_build_image: false
    privileged: true
    network: "media"
    command: ${MOLECULE_COMMAND:-"/lib/systemd/systemd"}
    extra_opts:
      - "--cgroupns=host"
      - "--tmpfs=/tmp:rw"
      - "--tmpfs=/run:rw,exec"
  - name: media.home.arpa
    image: media
    dockerfile: Dockerfile.debian.j2
    pre_build_image: false
    privileged: true
    network: "media"
    command: ${MOLECULE_COMMAND:-"/lib/systemd/systemd"}
    extra_opts:
      - "--cgroupns=host"
      - "--tmpfs=/tmp:rw"
      - "--tmpfs=/run:rw,exec"
  - name: streaming.home.arpa
    image: streaming
    dockerfile: Dockerfile.debian.j2
    pre_build_image: false
    privileged: true
    network: "media"
    command: ${MOLECULE_COMMAND:-"/lib/systemd/systemd"}
    extra_opts:
      - "--cgroupns=host"
      - "--tmpfs=/tmp:rw"
      - "--tmpfs=/run:rw,exec"
  - name: requests.home.arpa
    image: requests
    dockerfile: Dockerfile.debian.j2
    pre_build_image: false
    privileged: true
    network: "media"
    command: ${MOLECULE_COMMAND:-"/lib/systemd/systemd"}
    extra_opts:
      - "--cgroupns=host"
      - "--tmpfs=/tmp:rw"
      - "--tmpfs=/run:rw,exec"
  - name: proxy.home.arpa
    image: proxy
    dockerfile: Dockerfile.alpine.j2
    pre_build_image: false
    privileged: true
    network: "media"
    command: ${MOLECULE_COMMAND:-"/sbin/init"}
    extra_opts:
      - "--cgroupns=host"
      - "--tmpfs=/tmp:rw"
      - "--tmpfs=/run:rw,exec"

provisioner:
  name: ansible
  inventory:
    links:
      host_vars: "../host_vars/"
      group_vars: "../group_vars/"
      inventory: "../inventory.yml"
  env:
    ANSIBLE_ROLES_PATH: "../../roles"
  config_options:
    defaults:
      callback_result_format: yaml
      interpreter_python: /usr/bin/python3
    ssh_connection:
      pipelining: true
  playbooks:
    converge: converge.yml
verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - destroy
