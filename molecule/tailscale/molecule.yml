---
role_name_check: 1
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml
    ignore-errors: true
driver:
  name: podman
platforms:
  - name: tailscale.home.arpa
    image: tailscale
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    command: ${MOLECULE_COMMAND:-"/sbin/init"}
    extra_opts:
      - "--cgroupns=host"
      - "--tmpfs=/tmp:rw"
      - "--tmpfs=/run:rw,exec"
  - name: headscale.home.arpa
    image: headscale
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    command: ${MOLECULE_COMMAND:-"/sbin/init"}
    extra_opts:
      - "--cgroupns=host"
      - "--tmpfs=/tmp:rw"
      - "--tmpfs=/run:rw,exec"
  - name: proxy.home.arpa
    image: proxy
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    command: ${MOLECULE_COMMAND:-"/sbin/init"}
    extra_opts:
      - "--cgroupns=host"
      - "--tmpfs=/tmp:rw"
      - "--tmpfs=/run:rw,exec"

provisioner:
  name: ansible
  inventory:
    links:
      host_vars: "../../host_vars/"
      group_vars: "../../group_vars/"
      inventory: "../inventory.yml"
  env:
    ANSIBLE_ROLES_PATH: "../../roles"
  config_options:
    defaults:
      callback_result_format: yaml
      interpreter_python: /usr/bin/python3
    ssh_connection:
      pipelining: true
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - destroy
