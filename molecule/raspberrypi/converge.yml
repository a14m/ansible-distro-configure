---
- name: "Bootstrap"
  hosts: "raspberrypi"
  gather_facts: true
  vars:
    ansible_become_method: su
    # NOTE: also set below in the "Configure" play. Pihole depends on the
    # network role, so it runs a second time there; if these were only
    # defined in one play, the two runs would render the ethernet/wifi
    # nmconnection templates with different content (method=auto here vs
    # method=manual there), making every run report "changed" and failing
    # idempotence.
    network_ipv4_address: "{{ ansible_facts.default_ipv4.address }}"
    network_ipv4_gateway: "{{ ansible_facts.default_ipv4.gateway }}"
    user_public_keys:
      - "ssh-ed25519 AAAA...fMo"
      - "ssh-rsa AAAA...4I3"
    user_groups: ["wheel", "test_group"]
    ssh_public_key: "ssh-ed25519 AAAA...fMo"
    ssh_private_key: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
      QyNTUxOQAAACAQ0GydCVLVXnXpzBxM6MbmRIDHNjC8dqZoFHgx1PiSgQAAAJi7TmCqu05g
      qgAAAAtzc2gtZWQyNTUxOQAAACAQ0GydCVLVXnXpzBxM6MbmRIDHNjC8dqZoFHgx1PiSgQ
      AAAEBgO+cOwV2j8gNZ/EugDk+vbi0eGrK125vRcE3FOtJJMRDQbJ0JUtVedenMHEzoxuZE
      gMc2MLx2pmgUeDHU+JKBAAAAEm1vbGVjdWxlLXRlc3Qtb25seQECAw==
      -----END OPENSSH PRIVATE KEY-----
  roles:
    - role: "hostname"
    - role: "network"
    - role: "user"
    - role: "ssh"
    - role: "password_policy"
  pre_tasks:
    - name: "Update package cache"
      become: true
      ansible.builtin.package:
        update_cache: true
      async: 60
      poll: 5
      failed_when: false
      tags:
        - molecule-idempotence-notest
  tasks:
    - name: "Configure passwordless sudo for testing"
      ansible.builtin.copy:
        content: "%test_group ALL=(ALL) NOPASSWD: ALL\n"
        dest: "/etc/sudoers.d/test_group"
        mode: "0440"
        validate: 'visudo -cf %s'

- name: "Configure"
  hosts: "raspberrypi"
  gather_facts: true
  remote_user: "{{ username }}"
  vars:
    ansible_become_method: sudo
    network_ipv4_address: "{{ ansible_facts.default_ipv4.address }}"
    network_ipv4_gateway: "{{ ansible_facts.default_ipv4.gateway }}"
    vhost_proxy_host: "{{ inventory_hostname }}"
    locales:
      - "en_US.UTF-8 UTF-8"
    timezone: "GMT"
    pihole_interface: "eth0"
    pihole_domain: "pi.hole"
    pihole_hostname: "dns.example.com"
    pihole_totp_secret: "CHANGEME"
    pihole_admin_password: "{{ ('changeme' | hash('sha256') | hash('sha256'))[:64] }}"
    pihole_dhcp_enabled: false
    wireguard_autostart_connection: ""
    wg_portal_hostname: "vpn.example.com"
    grafana_hostname: "monitor.example.com"
    gateway_enabled: true
    gateway_local_ipv4_subnet: "10.0.0.0/24"
    grafana_dashboards:
      - name: "node-exporter-full"
        source: "https://grafana.com/api/dashboards/1860/revisions/45/download"
        datasource_mappings:
          - key: "${ds_prometheus}"
            value: "prometheus"
    vimrc_repo_url: "https://git.sr.ht/~a14m/.vim"
    password_store_repo_url: "https://github.com/octocat/Spoon-Knife"
    firefox_install_browserpass: true
    firefox_install_passff: true
    mount_point: "/mnt/backup"
    mount_device: "tmpfs"
    mount_fstype: "tmpfs"
    mount_options: "defaults,mode=0755"
    garage_rpc_secret: "{{ 'CHANGEME' | hash('sha256') }}"
    garage_access_key_id: "{{ ('CHANGEME' | hash('sha256'))[:20] | upper }}"
    garage_secret_access_key: "{{ ('CHANGEME' | hash('sha256'))[:40] }}"
    garage_admin_token: "{{ ('CHANGEME' | hash('sha256')) }}"
    garage_webui_hostname: "s3.example.com"
    garage_webui_auth_user: "example"
    garage_webui_auth_password_hash: "$2y$05$h9PuTgv/bjaDUemm3oLHTeFZ5T0OMFQVFtrSaoVw6mero0kZXT.e2"
    awscli_profile_name: "example"
    awscli_region: "eu-central-1"
    awscli_access_key_id: "CHANGEME"
    awscli_secret_access_key: "CHANGEME"
    fritzbox_6660_exporter_gateway_url: "http://10.0.0.1:49000"
    fritzbox_6660_exporter_username: "monitoring"
    fritzbox_6660_exporter_password: "changeme"
  pre_tasks:
    - name: "Override is_chroot fact for container environment"
      ansible.builtin.set_fact:
        ansible_facts: "{{ ansible_facts | combine({'is_chroot': false}) }}"
  roles:
    - role: "locales"
    - role: "timezone"
    - role: "bash"
    - role: "man"
    - role: "jq"
    - role: "ag"
    - role: "tcpdump"
    - role: "conntrack"
    - role: "whois"
    - role: "nmap"
    - role: "libheif"
    - role: "tmux"
    - role: "python"
    - role: "go"
    - role: "rust"
    - role: "nodejs"
    - role: "zoxide"
    - role: "gum"
    - role: "usbutils"
    - role: "wireguard"
    - role: "gateway"
    - role: "caddy"
    - role: "wg_portal"
    - role: "pihole"
    - role: "prometheus"
    - role: "prometheus-node-exporter"
    - role: "fritzbox_6660_exporter"
    - role: "grafana"
    - role: "alloy"
    - role: "mount"
    - role: "garage"
    - role: "garage-webui"
    - role: "awscli"
    - role: "gnome"
    - role: "gnome-calendar"
    - role: "gnome-loupe"
    - role: "gnome-papers"
    - role: "gnome-disk-utility"
    - role: "gnome-newsflash"
    - role: "gradia"
    - role: "rsync"
    - role: "gpg"
    - role: "dotfiles"
    - role: "vim"
    - role: "mise"
    - role: "neomutt"
    - role: "password_store"
    - role: "which"
    - role: "firefox"
    - role: "chromium"
    - role: "font"
    - role: "alacritty"
    - role: "btop"
    - role: "pipewire"
    - role: "claude"
    - role: "localsend"
    - role: "restic"
    - role: "ethtool"
