---
- name: "Proxy configure"
  gather_facts: true
  hosts:
    - proxy.home.arpa
  vars:
    network_ipv4_address: "{{ ansible_facts.default_ipv4.address }}"
  roles:
    - role: "caddy"

- name: "Subscriptions configure"
  gather_facts: true
  hosts:
    - subscriptions.home.arpa
  vars:
    network_ipv4_address: "{{ ansible_facts.default_ipv4.address }}"
    backup_repo: "s3:https://example.com/backups"
  roles:
    - role: "wallos"
    - role: "backup"
    - role: "alloy"
    - role: "ufw"
