---
role_name_check: 1
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml
    ignore-errors: true
driver:
  name: podman
platforms:
  - name: archlinux
    image: archlinux
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    command: ${MOLECULE_COMMAND:-"/lib/systemd/systemd"}
    extra_opts:
      - "--cgroupns=host"
      - "--tmpfs=/tmp:rw"
      - "--tmpfs=/run:rw,exec"
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"

provisioner:
  name: ansible
  inventory:
    links:
      host_vars: "../../host_vars/"
      group_vars: "../../group_vars/"
      inventory: "../inventory.yml"
  env:
    ANSIBLE_ROLES_PATH: "../../roles"
    GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') }}"
  config_options:
    defaults:
      callback_result_format: yaml
      interpreter_python: /usr/bin/python3
    ssh_connection:
      pipelining: true
  playbooks:
    converge: converge.yml
verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - destroy
