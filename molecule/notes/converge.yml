---
- name: "Proxy configure"
  gather_facts: true
  hosts:
    - proxy.home.arpa
  vars:
    network_ipv4_address: "{{ ansible_facts.default_ipv4.address }}"
  roles:
    - role: "caddy"

- name: "Notes configure"
  gather_facts: true
  hosts:
    - notes.home.arpa
  vars:
    network_ipv4_address: "{{ ansible_facts.default_ipv4.address }}"
    # pasta (rootless podman's default net) gives the container the host's IP,
    # which isn't bindable inside the netns - bind localhost in tests instead.
    couchdb_bind_address: "localhost"
    backup_repo: "s3:https://example.com/backups"
  roles:
    - role: "couchdb"
    - role: "backup"
    - role: "alloy"
    - role: "ufw"
