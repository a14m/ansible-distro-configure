---
homelab:
  vars:
    ansible_connection: >-
      {{ 'local' if inventory_hostname_short == lookup('pipe', 'uname -n').split('.') | first else 'ssh' }}
  hosts:
    desktop.lan:
    macbook.lan:
    laptop.lan:
    rpi5.lan:
    pve-01.lan:
    pve-02.lan:

containers:
  vars:
    ansible_connection: ssh
  hosts:
    proxy.home.arpa:
    headscale.home.arpa:
    git.home.arpa:
    tailscale.home.arpa:
    caldav.home.arpa:
    logs.home.arpa:
    metrics.home.arpa:
    monitor.home.arpa:
    subscriptions.home.arpa:
    notes.home.arpa:
    downloads.home.arpa:
    media.home.arpa:
