---
- name: "Update package cache"
  gather_facts: true
  hosts:
    - containers
  tasks:
    - name: "Update package cache"
      become: true
      ansible.builtin.package:
        update_cache: true
      async: 60
      poll: 5
      failed_when: false
      changed_when: false

- name: "Proxy configure"
  gather_facts: true
  hosts:
    - proxy.home.arpa
  roles:
    - role: "caddy"
    - role: "acme-sh"
    - role: "cloudflared"
    - role: "cloudflare-ddns"
    - role: "alloy"
    - role: "ufw"

- name: "Headscale configure"
  gather_facts: true
  hosts:
    - headscale.home.arpa
  roles:
    - role: "headscale"
    - role: "backup"
    - role: "alloy"
    - role: "ufw"

- name: "Git configure"
  gather_facts: true
  hosts:
    - git.home.arpa
  roles:
    - role: "cgit"
    - role: "backup"
    - role: "alloy"
    - role: "ufw"

- name: "Caldav configure"
  gather_facts: true
  hosts:
    - caldav.home.arpa
  roles:
    - role: "radicale"
    - role: "backup"
    - role: "alloy"
    - role: "ufw"

- name: "Tailscale configure"
  gather_facts: true
  hosts:
    - tailscale.home.arpa
  roles:
    - role: "tailscale"
    - role: "alloy"
    - role: "ufw"

- name: "Logs configure"
  gather_facts: true
  hosts:
    - logs.home.arpa
  roles:
    - role: "loki"
    - role: "alloy"
    - role: "ufw"

- name: "Metrics configure"
  gather_facts: true
  hosts:
    - metrics.home.arpa
  roles:
    - role: "prometheus"
    - role: "alloy"
    - role: "ufw"

- name: "Monitor configure"
  gather_facts: true
  hosts:
    - monitor.home.arpa
  roles:
    - role: "grafana"
    - role: "alloy"
    - role: "ufw"

- name: "Subscriptions configure"
  gather_facts: true
  hosts:
    - subscriptions.home.arpa
  roles:
    - role: "wallos"
    - role: "backup"
    - role: "alloy"
    - role: "ufw"

- name: "Notes configure"
  gather_facts: true
  hosts:
    - notes.home.arpa
  roles:
    - role: "couchdb"
    - role: "backup"
    - role: "alloy"
    - role: "ufw"

- name: "Downloads configure"
  gather_facts: true
  hosts:
    - downloads.home.arpa
  pre_tasks:
    # The VPN has no IPv6, so IPv6 attempts hang until their timeout before programs fall back to IPv4.
    # Set inside the container: Proxmox rejects net.* sysctls in its config
    - name: "Disable IPv6"
      become: true
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: "/etc/sysctl.d/99-disable-ipv6.conf"
        sysctl_set: true
        state: "present"
        reload: true
      loop:
        - "net.ipv6.conf.all.disable_ipv6"
        - "net.ipv6.conf.default.disable_ipv6"
  roles:
    - role: "wireguard"
    - role: "ufw"
    - role: "qbittorrent"
    - role: "prowlarr"
    - role: "rsync"
    - role: "backup"

- name: "Media configure"
  gather_facts: true
  hosts:
    - media.home.arpa
  roles:
    - role: "ufw"
    - role: "sonarr"
    - role: "radarr"
    - role: "bazarr"
    - role: "backup"

- name: "Streaming configure"
  gather_facts: true
  hosts:
    - streaming.home.arpa
  roles:
    - role: "ufw"
    - role: "jellyfin"
    - role: "backup"
