---
- name: "Proxmox VE snapshot"
  gather_facts: true
  hosts:
    - pve-01.lan
    - pve-02.lan
  tasks:
    - name: "Snapshot LXC containers"
      ansible.builtin.include_role:
        name: "pve-lxc-snapshot"
      vars:
        pve_lxc_id: "{{ hostvars[service_host].pve_lxc_id }}"
      loop: "{{ groups['containers'] }}"
      loop_control:
        loop_var: "service_host"
      when: hostvars[service_host].pve_lxc_node == inventory_hostname

- name: "Machine upgrade"
  gather_facts: true
  hosts:
    - desktop.lan
    - laptop.lan
    - rpi5.lan
    - pve-01.lan
    - pve-02.lan
  roles:
    - role: "upgrade"

- name: "Container upgrade"
  gather_facts: true
  hosts:
    - containers
  roles:
    - role: "upgrade"
